name: Finalize PuttVision V12 temp

on:
  push:
    branches: [ v12-unified-surface ]
    paths:
      - '.github/workflows/v12-finalize-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-unified-surface
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V12 integration
        shell: bash
        run: |
          python .v12/apply_v12.py || test $? -eq 1
          python .v12/fix_after_patch.py
      - name: No blocking green-read calls in UI
        run: |
          ! grep -R 'GreenReadAdvisor.read' app/src/main/java/com/puttvision/screen/MainActivity.kt app/src/main/java/com/puttvision/screen/GreenView.kt
      - name: Diff sanity
        run: git diff --check
      - name: Full regression
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V12 app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          test -n "$(git status --porcelain app)"
          git commit -m 'feat: V12 unified green surface and adaptive runtime'
          git pull --rebase origin v12-unified-surface
          git push origin HEAD:v12-unified-surface
