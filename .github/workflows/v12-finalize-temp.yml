name: Finalize PuttVision V12 temp

on:
  push:
    branches: [ v12-unified-surface ]
    paths:
      - '.github/workflows/v12-finalize-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-unified-surface
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V12 integration
        shell: bash
        run: |
          # The original patch had an early diagnostic guard in the middle of the
          # file. Disable only that temporary guard so later TV/preview sections run.
          python - <<'PY'
          from pathlib import Path
          p = Path('.v12/apply_v12.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("if 'GreenReadAdvisor.read(' in text:\n    raise RuntimeError('MainActivity still contains blocking GreenReadAdvisor.read')", "if False and 'GreenReadAdvisor.read(' in text:\n    raise RuntimeError('MainActivity still contains blocking GreenReadAdvisor.read')")
          p.write_text(s, encoding='utf-8')
          PY
          python .v12/apply_v12.py
          python .v12/fix_after_patch.py
      - name: No blocking green-read calls in UI
        run: |
          ! grep -R 'GreenReadAdvisor.read' app/src/main/java/com/puttvision/screen/MainActivity.kt app/src/main/java/com/puttvision/screen/GreenView.kt
      - name: Diff sanity
        run: git diff --check
      - name: Full regression
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V12 app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          test -n "$(git status --porcelain app)"
          git commit -m 'feat: V12 unified green surface and adaptive runtime'
          git pull --rebase origin v12-unified-surface
          git push origin HEAD:v12-unified-surface
