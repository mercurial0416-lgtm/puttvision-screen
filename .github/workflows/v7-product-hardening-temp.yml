name: Verify product hardening V7 temp

on:
  push:
    branches: [ product-hardening-v7 ]
    paths: [ '.github/workflows/v7-product-hardening-temp.yml' ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply V7 integration patch
        run: python3 .v7/apply_v7.py

      - name: Compile verification
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified product hardening
        shell: bash
        run: |
          rm -rf .v7
          rm -f .github/workflows/v7-product-hardening-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden PuttVision camera, calibration, stats and handsfree UX'
          git push origin HEAD:product-hardening-v7
