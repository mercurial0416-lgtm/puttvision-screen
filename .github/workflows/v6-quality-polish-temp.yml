name: Verify measurement quality V6 polish

on:
  push:
    branches: [ measurement-quality-v6 ]
    paths: [ '.github/workflows/v6-quality-polish-temp.yml' ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply polish
        run: python3 .v6/polish.py
      - name: Compile verification
        run: gradle assembleDebug
      - name: Commit verified polish
        shell: bash
        run: |
          rm -rf .v6
          rm -f .github/workflows/v6-quality-polish-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tighten V6 measurement quality flow"
          git push origin HEAD:measurement-quality-v6
