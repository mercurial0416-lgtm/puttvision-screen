name: Verify V17 authentic simulator TV

on:
  push:
    branches: [ agent/v17-tv-authentic-simulator ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puttvision-v17-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and wire V17 simulator UI
        run: |
          python3 ci/v17_apply.py
          if ! git diff --quiet; then
            git config user.name "puttvision-v17-bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/puttvision/screen/V17SimulatorTvView.kt \
                    app/src/main/java/com/puttvision/screen/ExternalDisplayController.kt \
                    app/src/main/java/com/puttvision/screen/MainActivity.kt
            git diff --cached --check
            git commit -m "feat: unify local and external V17 simulator TV"
            git push origin HEAD:agent/v17-tv-authentic-simulator
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Compile both debug APKs
        run: gradle assembleConsumerDebug assembleDeveloperDebug
