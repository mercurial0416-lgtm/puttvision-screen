name: Commit verified PuttVision V8 app code temp

on:
  push:
    branches: [ productization-v8 ]
    paths:
      - '.github/workflows/v8-code-commit-temp.yml'

permissions:
  contents: write

concurrency:
  group: puttvision-v8-code-commit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productization-v8
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V8 app integration
        shell: bash
        run: |
          sed -i 's/ScrollView\.LayoutParams(-1, -2)/FrameLayout.LayoutParams(-1, -2)/g' .v8/apply_productization.py
          python3 .v8/apply_productization.py
          git checkout -- .github/workflows/release-apk.yml
      - name: Compile verification
        run: gradle assembleDebug
      - name: Commit verified app code only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/puttvision/screen/MainActivity.kt \
            app/src/main/java/com/puttvision/screen/GreenView.kt \
            app/src/main/java/com/puttvision/screen/ImpactReplayView.kt \
            app/src/main/java/com/puttvision/screen/AppUpdater.kt \
            app/src/main/res/xml/file_paths.xml
          if git diff --cached --quiet; then
            echo 'No app integration changes to commit'
          else
            git commit -m 'feat: integrate sale-ready PuttVision V8 product UX'
            git push origin HEAD:productization-v8
          fi
