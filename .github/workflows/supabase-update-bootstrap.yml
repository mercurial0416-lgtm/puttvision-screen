name: Verify Supabase public updater

on:
  push:
    branches: [ agent/supabase-update-bootstrap ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release metadata and download private APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          TAG=$(jq -r '.tag_name' <<<"$RELEASE")
          VERSION_CODE=${TAG#pv-}
          VERSION_NAME=$(jq -r '.name' <<<"$RELEASE" | sed -E 's/^PuttVision[[:space:]]+//; s/^v//')
          ASSET_URL=$(jq -r '.assets[] | select(.name == "puttvision-consumer.apk") | .url' <<<"$RELEASE")
          DIGEST=$(jq -r '.assets[] | select(.name == "puttvision-consumer.apk") | .digest' <<<"$RELEASE")
          SHA=${DIGEST#sha256:}
          test -n "$ASSET_URL"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]

          gh api -H 'Accept: application/octet-stream' "$ASSET_URL" > puttvision-consumer.apk
          test -s puttvision-consumer.apk
          echo "$SHA  puttvision-consumer.apk" | sha256sum -c -
          SIZE=$(stat -c%s puttvision-consumer.apk)

          echo "PV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PV_RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "PV_APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Request one-time Supabase upload token
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg action prepare \
            --argjson vc "$PV_VERSION_CODE" \
            --arg vn "$PV_VERSION_NAME" \
            --arg sha "$PV_RELEASE_SHA" \
            --argjson size "$PV_APK_SIZE" \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}')
          curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_URL" \
            -H 'content-type: application/json' \
            -H "x-github-token: $GH_TOKEN" \
            --data-binary "$PAYLOAD" > prepare.json
          jq -e '.ok == true and .action == "prepare"' prepare.json >/dev/null
          echo "PV_UPLOAD_TOKEN=$(jq -r '.uploadToken' prepare.json)" >> "$GITHUB_ENV"
          echo "PV_TUS_ENDPOINT=$(jq -r '.tusEndpoint' prepare.json)" >> "$GITHUB_ENV"
          echo "PV_OBJECT_PATH=$(jq -r '.objectPath' prepare.json)" >> "$GITHUB_ENV"
          echo "PV_APK_URL=$(jq -r '.apkUrl' prepare.json)" >> "$GITHUB_ENV"
          echo "PV_MANIFEST_URL=$(jq -r '.manifestUrl' prepare.json)" >> "$GITHUB_ENV"

      - name: Upload APK directly with signed TUS token
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock tus-js-client@4.3.1 >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const tus = require('tus-js-client');
          const file = 'puttvision-consumer.apk';
          const size = fs.statSync(file).size;
          const upload = new tus.Upload(fs.createReadStream(file), {
            endpoint: process.env.PV_TUS_ENDPOINT,
            uploadSize: size,
            retryDelays: [0, 1000, 3000, 5000, 10000],
            headers: { 'x-signature': process.env.PV_UPLOAD_TOKEN },
            uploadDataDuringCreation: true,
            removeFingerprintOnSuccess: true,
            chunkSize: 6 * 1024 * 1024,
            metadata: {
              bucketName: 'puttvision-update',
              objectName: process.env.PV_OBJECT_PATH,
              contentType: 'application/vnd.android.package-archive',
              cacheControl: '31536000',
            },
            onError(error) {
              console.error(error);
              process.exit(1);
            },
            onProgress(uploaded, total) {
              const pct = ((uploaded / total) * 100).toFixed(1);
              console.log(`TUS ${pct}%`);
            },
            onSuccess() {
              console.log('TUS upload complete');
            },
          });
          upload.start();
          NODE

      - name: Verify public APK SHA before publishing manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location "$PV_APK_URL" -o uploaded.apk
          test "$(stat -c%s uploaded.apk)" -eq "$PV_APK_SIZE"
          echo "$PV_RELEASE_SHA  uploaded.apk" | sha256sum -c -

      - name: Publish verified manifest and recheck public endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg action finalize \
            --argjson vc "$PV_VERSION_CODE" \
            --arg vn "$PV_VERSION_NAME" \
            --arg sha "$PV_RELEASE_SHA" \
            --argjson size "$PV_APK_SIZE" \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}')
          curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_URL" \
            -H 'content-type: application/json' \
            -H "x-github-token: $GH_TOKEN" \
            --data-binary "$PAYLOAD" > finalize.json
          jq -e '.ok == true and .action == "finalize"' finalize.json >/dev/null

          LIVE=$(curl --fail-with-body --silent --show-error -H 'Cache-Control: no-cache' "$PV_MANIFEST_URL")
          echo "$LIVE" | jq -e --argjson vc "$PV_VERSION_CODE" --arg sha "$PV_RELEASE_SHA" \
            '.versionCode == $vc and .sha256 == $sha' >/dev/null
          echo "$LIVE" | jq .
