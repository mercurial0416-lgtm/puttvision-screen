name: Verify PuttVision V9 productization temp

on:
  push:
    branches: [ productization-v9 ]
    paths:
      - '.github/workflows/v9-verify-temp.yml'
      - '.v9/**'

permissions:
  contents: write

concurrency:
  group: puttvision-v9-productization
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productization-v9
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply V9 integration
        run: python3 .v9/apply_v9.py

      - name: Unit regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Compile both distribution channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug

      - name: Commit verified V9 app code
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app
          if git diff --cached --quiet; then
            echo 'No V9 app changes to commit'
          else
            git commit -m 'feat: harden PuttVision V9 commercial productization'
            git push origin HEAD:productization-v9
          fi
