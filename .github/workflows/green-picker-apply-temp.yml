name: Apply green picker temp

on:
  push:
    branches: [ green-picker-speed-range ]
    paths: [ '.github/workflows/green-picker-apply-temp.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Patch commercial UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/puttvision/screen/MainActivity.kt')
          source = path.read_text()

          def replace_between(src, start_marker, next_marker, replacement_path):
              start = src.index(start_marker)
              end = src.index(next_marker, start)
              replacement = Path(replacement_path).read_text().rstrip()
              return src[:start] + replacement + '\n\n    ' + src[end:]

          source = source.replace(
              '    private var practicePatternIndex = 0\n    private var practiceShotsTaken = 0',
              '    private var practicePatternIndex = 0\n    private var practiceGreenPresetIndex = 2\n    private var practiceShotsTaken = 0',
              1,
          )

          preset_block = '''    private data class PracticeGreenPreset(\n        val title: String,\n        val subtitle: String,\n        val sideSlopePct: Double,\n        val longSlopePct: Double,\n        val previewStyle: Int\n    )\n\n    private val practiceGreenPresets = listOf(\n        PracticeGreenPreset("스트레이트", "0.5m / 20in", 0.0, 0.0, 0),\n        PracticeGreenPreset("좌→우 미세", "0.5m / 20in", 1.3, 0.0, 1),\n        PracticeGreenPreset("중앙 브레이크", "0.5m / 20in", -1.8, -0.6, 2),\n        PracticeGreenPreset("오르막 스트레이트", "1.2m / 45in", 0.0, 2.2, 3),\n        PracticeGreenPreset("오르막 브레이크", "1.2m / 45in", 2.8, 1.1, 4),\n        PracticeGreenPreset("복합 경사", "1.2m / 45in", -3.4, -1.6, 5)\n    )\n\n'''
          permission_marker = '    private val permission =\n'
          if 'private data class PracticeGreenPreset(' not in source:
              source = source.replace(permission_marker, preset_block + permission_marker, 1)

          source = replace_between(
              source,
              'private fun showPracticeEntrance() {',
              'private fun showGameEntrance()',
              '.green-picker/practice-section.txt',
          )

          source = replace_between(
              source,
              'private fun applyPracticeTargetForNextShot() {',
              'private fun onSessionShotFinished()',
              '.green-picker/apply-target.txt',
          )

          source = source.replace(
              '        max = 5\n        progress = ((practiceGreenSpeed - 2.5) * 10).toInt().coerceIn(0, 5)',
              '        max = 12\n        progress = ((practiceGreenSpeed - 2.4) * 10).toInt().coerceIn(0, 12)',
              1,
          )
          source = source.replace('                practiceGreenSpeed = 2.5 + progress * .1', '                practiceGreenSpeed = 2.4 + progress * .1', 1)

          path.write_text(source)
          PY

      - name: Compile verification
        run: gradle assembleDebug

      - name: Commit verified change
        shell: bash
        run: |
          git clean -fdX
          rm -rf .green-picker
          rm -f .github/workflows/green-picker-apply-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add practice green library and 2.4-3.6 speed range"
          git push origin HEAD:green-picker-speed-range
