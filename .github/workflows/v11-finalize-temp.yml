name: Finalize PuttVision V11 temp

on:
  push:
    branches: [ v11-tv-physics ]
    paths:
      - '.github/workflows/v11-finalize-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-tv-physics
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply solver performance fix
        run: python .v11/fix_perf.py
      - name: Diff sanity
        run: git diff --check
      - name: Full V11 regression
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit optimized V11
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/puttvision/screen/GreenReadAdvisor.kt
          test -n "$(git status --porcelain app/src/main/java/com/puttvision/screen/GreenReadAdvisor.kt)"
          git commit -m 'perf: stop green read simulation when ball settles'
          git pull --rebase origin v11-tv-physics
          git push origin HEAD:v11-tv-physics
