name: V162 one-shot release dispatcher

on:
  workflow_run:
    workflows: ["Solo accuracy and release verify"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.id == 32722933935 && github.event.workflow_run.run_attempt > 1 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current-main direct release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v152-direct-release.yml --repo "$GITHUB_REPOSITORY" --ref main
