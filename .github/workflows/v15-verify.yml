name: Verify V15 product-grade bundle

on:
  push:
    branches: [ agent/v15-product-grade-putting ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puttvision-v15-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure V15 commercial game selector is wired
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/puttvision/screen/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          changed = False

          def replace_once(old, new, label):
              global text, changed
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 legacy match, got {count}')
              text = text.replace(old, new, 1)
              changed = True

          replace_once('''                text = when (gameModeIndex) {
                    0 -> "9홀 매치"
                    1 -> "18홀 매치"
                    2 -> "거리 맞추기"
                    else -> "랜덤 경사"
                }''', '''                text = when (gameModeIndex) {
                    0 -> "9홀 매치"
                    1 -> "18홀 매치"
                    2 -> "거리 맞추기"
                    3 -> "랜덤 경사"
                    4 -> "퍼팅 다트"
                    5 -> "퍼팅 컬링"
                    6 -> "배틀 퍼팅"
                    else -> "고스트 챌린지"
                }''', 'game title')

          replace_once('''                text = when (gameModeIndex) {
                    0 -> "빠르게 즐기는 9홀 스코어 매치"
                    1 -> "거리와 경사가 이어지는 풀 라운드"
                    2 -> "목표 거리에 가장 가깝게 붙이기"
                    else -> "매 샷 달라지는 그린을 읽는 게임"
                }''', '''                text = when (gameModeIndex) {
                    0 -> "빠르게 즐기는 9홀 스코어 매치"
                    1 -> "거리와 경사가 이어지는 풀 라운드"
                    2 -> "목표 거리에 가장 가깝게 붙이기"
                    3 -> "매 샷 달라지는 그린을 읽는 게임"
                    4 -> "홀 주변 링에 붙일수록 높은 점수"
                    5 -> "센터에 가장 가깝게 보내는 정밀 게임"
                    6 -> "최대 4명이 턴제로 겨루는 스코어 배틀"
                    else -> "내 최고 기록의 궤적과 정면 승부"
                }''', 'game description')

          replace_once('''    panel.addView(label("게임 모드"))
    val modes = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
    listOf("9홀", "18홀", "거리", "랜덤 경사").forEachIndexed { i, title ->
        modes.addView(darkChoice(title, gameModeIndex == i) {
            gameModeIndex = i
            showGameEntrance()
        }, LinearLayout.LayoutParams(0, sdp(if (compact) 36 else 42), 1f).apply { if (i > 0) marginStart = sdp(5) })
    }
    panel.addView(modes, LinearLayout.LayoutParams(-1, -2).apply { topMargin = sdp(5) })''', '''    panel.addView(label("게임 모드"))
    val modeRows = listOf(
        listOf(0 to "9홀", 1 to "18홀", 2 to "거리", 3 to "랜덤"),
        listOf(4 to "다트", 5 to "컬링", 6 to "배틀", 7 to "고스트")
    )
    modeRows.forEachIndexed { rowIndex, entries ->
        val modes = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
        entries.forEachIndexed { i, entry ->
            val modeIndex = entry.first
            modes.addView(darkChoice(entry.second, gameModeIndex == modeIndex) {
                gameModeIndex = modeIndex
                showGameEntrance()
            }, LinearLayout.LayoutParams(0, sdp(if (compact) 31 else 36), 1f).apply { if (i > 0) marginStart = sdp(4) })
        }
        panel.addView(modes, LinearLayout.LayoutParams(-1, -2).apply { topMargin = sdp(if (rowIndex == 0) 5 else 4) })
    }''', 'mode selector')

          replace_once('''                text = when (gameModeIndex) {
                    0 -> "9 HOLES"
                    1 -> "18 HOLES"
                    else -> "RANDOM TERRAIN"
                }''', '''                text = when (gameModeIndex) {
                    0 -> "9 HOLES"
                    1 -> "18 HOLES"
                    3 -> "RANDOM TERRAIN"
                    4 -> "PUTTING DART"
                    5 -> "PUTTING CURLING"
                    6 -> "PUTTING BATTLE"
                    7 -> "GHOST CHALLENGE"
                    else -> "DISTANCE CONTROL"
                }''', 'mode badge')

          replace_once('''                text = when (gameModeIndex) {
                    0 -> "  ·  홀마다 거리/경사 자동 구성"
                    1 -> "  ·  누적 스코어 풀 라운드"
                    else -> "  ·  매 샷 다른 2D 그린 프로필"
                }''', '''                text = when (gameModeIndex) {
                    0 -> "  ·  홀마다 거리/경사 자동 구성"
                    1 -> "  ·  누적 스코어 풀 라운드"
                    3 -> "  ·  매 샷 다른 2D 그린 프로필"
                    4 -> "  ·  컵 주변 점수 링 정밀 공략"
                    5 -> "  ·  센터 거리로 점수를 겨루는 모드"
                    6 -> "  ·  최대 4인 턴제 점수 배틀"
                    7 -> "  ·  내 베스트 샷과 실시간 비교"
                    else -> "  ·  목표 거리 오차 최소화"
                }''', 'mode badge detail')

          legacy_footer = '''        text = "${gamePlayers}명  ·  ${when (gameModeIndex) { 0 -> "9홀"; 1 -> "18홀"; 2 -> "${gameDistanceM}m 거리"; else -> "랜덤 경사" }}  ·  GREEN ${"%.1f".format(practiceGreenSpeed)}"'''
          v15_footer = '''        text = "${gamePlayers}명  ·  ${when (gameModeIndex) { 0 -> "9홀"; 1 -> "18홀"; 2 -> "${gameDistanceM}m 거리"; 3 -> "랜덤 경사"; 4 -> "다트"; 5 -> "컬링"; 6 -> "배틀"; else -> "고스트" }}  ·  GREEN ${"%.1f".format(practiceGreenSpeed)}"'''
          replace_once(legacy_footer, v15_footer, 'game footer')

          if 'gameModeIndex = s.gameModeIndex.coerceIn(0, 7)' not in text:
              legacy = 'gameModeIndex = s.gameModeIndex.coerceIn(0, 3)'
              if text.count(legacy) != 1:
                  raise SystemExit('recovery selector range missing')
              text = text.replace(legacy, 'gameModeIndex = s.gameModeIndex.coerceIn(0, 7)', 1)
              changed = True

          if '4 -> PracticeMode.DART' not in text:
              pattern = re.compile(r'''            val mode = when \(gameModeIndex\) \{\n                0 -> PracticeMode\.NINE_HOLE\n                1 -> PracticeMode\.EIGHTEEN_HOLE\n                2 -> PracticeMode\.DISTANCE\n                else -> PracticeMode\.RANDOM_SLOPE\n            \}''')
              replacement = '''            val mode = when (gameModeIndex) {
                0 -> PracticeMode.NINE_HOLE
                1 -> PracticeMode.EIGHTEEN_HOLE
                2 -> PracticeMode.DISTANCE
                3 -> PracticeMode.RANDOM_SLOPE
                4 -> PracticeMode.DART
                5 -> PracticeMode.CURLING
                6 -> PracticeMode.BATTLE
                else -> PracticeMode.GHOST
            }'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'session mode mapping: expected 1 legacy match, got {count}')
              changed = True

          legacy_short = '''${when (gameModeIndex) { 0 -> "9홀"; 1 -> "18홀"; 2 -> "거리 맞추기"; else -> "랜덤 경사" }}'''
          v15_short = '''${when (gameModeIndex) { 0 -> "9홀"; 1 -> "18홀"; 2 -> "거리 맞추기"; 3 -> "랜덤 경사"; 4 -> "다트"; 5 -> "컬링"; 6 -> "배틀"; else -> "고스트" }}'''
          if legacy_short in text:
              text = text.replace(legacy_short, v15_short)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('V15 commercial UI changes applied')
          else:
              print('V15 commercial UI already current')
          PY
          if ! git diff --quiet -- app/src/main/java/com/puttvision/screen/MainActivity.kt; then
            git config user.name "puttvision-v15-bot"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/puttvision/screen/MainActivity.kt
            git diff --cached --check
            git commit -m "feat: expose V15 game modes in commercial UI"
            git push origin HEAD:agent/v15-product-grade-putting
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile debug APKs
        run: gradle assembleConsumerDebug assembleDeveloperDebug
