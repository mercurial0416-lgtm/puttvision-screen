name: Verify V15 product-grade bundle

on:
  push:
    branches: [ agent/v15-product-grade-putting ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puttvision-v15-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile debug APKs
        run: gradle assembleConsumerDebug assembleDeveloperDebug
