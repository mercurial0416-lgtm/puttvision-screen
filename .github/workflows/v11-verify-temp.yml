name: Verify PuttVision V11 temp

on:
  push:
    branches: [ v11-tv-physics ]
    paths:
      - '.github/workflows/v11-verify-temp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v11-tv-physics
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V11 source patch
        run: python .v11/apply_v11.py
      - name: Diff sanity
        run: git diff --check
      - name: V11 unit regression
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V11 app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          test -n "$(git status --porcelain app)"
          git commit -m 'feat: V11 physical TV read and slope flow'
          git pull --rebase origin v11-tv-physics
          git push origin HEAD:v11-tv-physics
