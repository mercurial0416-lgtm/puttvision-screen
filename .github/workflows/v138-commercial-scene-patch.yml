name: V138 commercial scene guarded patch

on:
  push:
    branches:
      - agent/v138-commercial-screen-golf-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v138-commercial-screen-golf-parity
          fetch-depth: 0
      - name: Patch Filament course into commercial presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/puttvision/screen/V133FilamentCourse.kt')
          s = p.read_text()
          if 'V138 commercial screen-golf scene' in s:
              print('V138 scene patch already present')
              raise SystemExit(0)

          def sub(pattern, replacement, label):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              s = s2

          s = s.replace(
              '    const val FLAG_HEIGHT_M = 1.05f\n',
              '    const val FLAG_HEIGHT_M = 1.85f\n'
          )

          s = s.replace(
              '    private var fill = 0\n',
              '    private var fill = 0\n    // V138 commercial screen-golf scene: smooth broadcast camera, never debug-camera snapping.\n    private val commercialCamera = V138CameraSmoother()\n'
          )

          sub(
              r'    private fun buildTurfMaterial\(\): Material \{.*?\n    \}\n\n    private fun buildLitMaterial',
              '''    private fun buildTurfMaterial(): Material {
        val source = """
            void material(inout MaterialInputs material) {
                vec3 p = getUserWorldPosition();
                float b1 = sin(p.x * 93.0 + p.y * 17.0);
                float b2 = cos(p.y * 121.0 - p.x * 13.0);
                float b3 = sin((p.x + p.y) * 167.0);
                material.normal = normalize(vec3(
                    (b1 + 0.45 * b3) * 0.024,
                    (b2 - 0.35 * b3) * 0.024,
                    1.0
                ));
                prepareMaterial(material);

                // Layered turf variation: broad mowing direction is intentionally subtle, while
                // fine-frequency variation breaks the flat plastic look without visible stripes.
                float macroA = sin(p.x * 0.71 + p.y * 0.29);
                float macroB = cos(p.y * 1.17 - p.x * 0.43);
                float mowing = sin(p.y * 3.8 + 0.20 * sin(p.x * 0.8));
                float fleck = b1 * b2 * 0.006 + b3 * 0.004;
                float shade = 0.965 + macroA * 0.018 + macroB * 0.014 + mowing * 0.007 + fleck;
                material.baseColor.rgb = materialParams.baseColor * shade;
                material.roughness = 0.88 + 0.035 * (0.5 + 0.5 * b2);
                material.reflectance = 0.20;
            }
        """.trimIndent()
        val pkg = MaterialBuilder()
            .platform(MaterialBuilder.Platform.MOBILE)
            .name("PV138 Layered Turf")
            .shading(MaterialBuilder.Shading.LIT)
            .uniformParameter(MaterialBuilder.UniformType.FLOAT3, "baseColor")
            .material(source)
            .optimization(MaterialBuilder.Optimization.PERFORMANCE)
            .build(engine)
        check(pkg.isValid) { "V138 turf material compile failed" }
        val buffer = pkg.buffer
        return Material.Builder().payload(buffer, buffer.remaining()).build(engine)
    }

    private fun buildLitMaterial''',
              'turf material'
          )

          s = s.replace(
              '        skybox = Skybox.Builder().color(.43f, .58f, .64f, 1f).build(engine).also { scene.skybox = it }',
              '        skybox = Skybox.Builder().color(.34f, .49f, .57f, 1f).build(engine).also { scene.skybox = it }'
          ).replace(
              '            .intensity(82_000f)',
              '            .intensity(104_000f)'
          ).replace(
              '            .intensity(7_500f)',
              '            .intensity(13_500f)'
          )

          s = s.replace(
              '        val geometry = V133Geometry.sphere(0f, 0f, 0f, V133CourseSpec.BALL_RADIUS_M, 12, 18)',
              '        val geometry = V133Geometry.sphere(0f, 0f, 0f, V133CourseSpec.BALL_RADIUS_M, 18, 28)'
          )

          s = s.replace(
              '            materialInstance(turfMaterial, .115f, .245f, .085f),',
              '            materialInstance(turfMaterial, .090f, .185f, .060f),'
          ).replace(
              '            materialInstance(turfMaterial, .155f, .335f, .105f),',
              '            materialInstance(turfMaterial, .135f, .275f, .090f),'
          ).replace(
              '            materialInstance(turfMaterial, .205f, .455f, .135f),',
              '            materialInstance(turfMaterial, .170f, .365f, .112f),'
          )

          sub(
              r'    private fun addBunkers\(settings: GreenSettings, d: Double\) \{.*?\n    \}\n\n    private fun addTrees',
              '''    private fun addBunkers(settings: GreenSettings, d: Double) {
        val placements = listOf(
            floatArrayOf(-3.05f, (d * .72).toFloat(), .95f, .46f),
            floatArrayOf(3.20f, (d * .90 + .45).toFloat(), 1.08f, .52f)
        )
        placements.forEach { p ->
            val z = V133Geometry.groundHeight(settings, d, p[0].toDouble(), p[1].toDouble()) + .010f
            val bunker = V133Geometry.bunkerBowl(p[0], p[1], z, p[2], p[3], 48)
            sceneMeshes += createRenderable(
                bunker,
                materialInstance(sandMaterial, .73f, .665f, .52f),
                castShadow = false,
                contactShadow = true
