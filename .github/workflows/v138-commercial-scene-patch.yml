    private fun addTrees''',
              'bunkers'
          )

          sub(
              r'    private fun addTrees\(settings: GreenSettings, d: Double, tier: V24RenderTier\) \{.*?\n    \}\n\n    private fun addCupAndFlag',
              '''    private fun addTrees(settings: GreenSettings, d: Double, tier: V24RenderTier) {
        val count = when (tier) {
            V24RenderTier.HIGH -> 22
            V24RenderTier.BALANCED -> 15
            V24RenderTier.PERFORMANCE -> 9
        }
        for (i in 0 until count) {
            val side = if (i and 1 == 0) -1f else 1f
            val lane = i / 2
            val x = side * (5.4f + (lane % 4) * 1.28f + ((i * 37) % 9) * .08f)
            val y = (-1.2 + lane * 2.05 + (i % 3) * .47).toFloat().coerceAtMost((d + 15.0).toFloat())
            val scale = .84f + ((i * 17) % 7) * .065f
            val baseZ = V133Geometry.groundHeight(settings, d, x.toDouble(), y.toDouble())

            val trunk = V133Geometry.cylinder(x, y, baseZ, .055f * scale, .88f * scale, 12)
            sceneMeshes += createRenderable(
                trunk,
                materialInstance(propMaterial, .205f, .125f, .064f),
                castShadow = true,
                contactShadow = true
            )

            if (i % 4 == 0) {
                // Conifers read far more naturally in silhouette than a single green ellipsoid.
                for (layer in 0..2) {
                    val z = baseZ + (.48f + layer * .28f) * scale
                    val r = (.54f - layer * .10f) * scale
                    val h = (.82f - layer * .08f) * scale
                    val crown = V133Geometry.cone(x, y, z, r, h, 16)
                    sceneMeshes += createRenderable(
                        crown,
                        materialInstance(propMaterial, .070f + layer * .008f, .185f + layer * .012f, .063f),
                        castShadow = true,
                        contactShadow = false
                    )
                }
            } else {
                val crownZ = baseZ + .98f * scale
                val tones = arrayOf(
                    floatArrayOf(.075f, .205f, .070f),
                    floatArrayOf(.090f, .235f, .078f),
                    floatArrayOf(.065f, .185f, .060f)
                )
                val tone = tones[i % tones.size]
                val lobes = arrayOf(
                    floatArrayOf(-.24f, -.05f, .02f, .52f, .46f, .58f),
                    floatArrayOf(.23f, .01f, .08f, .49f, .44f, .62f),
                    floatArrayOf(.00f, .12f, .34f, .43f, .40f, .55f)
                )
                lobes.forEachIndexed { li, l ->
                    val crown = V133Geometry.ellipsoid(
                        x + l[0] * scale,
                        y + l[1] * scale,
                        crownZ + l[2] * scale,
                        l[3] * scale,
                        l[4] * scale,
                        l[5] * scale,
                        8,
                        14
                    )
                    val lift = li * .008f
                    sceneMeshes += createRenderable(
                        crown,
                        materialInstance(propMaterial, tone[0] + lift, tone[1] + lift, tone[2]),
                        castShadow = true,
                        contactShadow = false
                    )
                }
            }
        }
    }

    private fun addCupAndFlag''',
              'trees'
          )

          sub(
              r'    private fun addCupAndFlag\(settings: GreenSettings, d: Double\) \{.*?\n    \}\n\n    private fun createRenderable',
              '''    private fun addCupAndFlag(settings: GreenSettings, d: Double) {
        // Visual green sits 18 mm above the mathematical terrain. The opening is now cut from the
        // green mesh itself; this liner therefore starts at the exact visible surface and extends
        // through the regulation 101.6 mm depth used by V135 physics.
        val surfaceZ = GreenTerrain.effectiveHeightAt(settings, 0.0, d).toFloat() + .018f
        val liner = V133Geometry.cupWall(
            0f,
            d.toFloat(),
            surfaceZ - .002f,
            V133CourseSpec.HOLE_RADIUS_M,
            V135RigidBallPhysics.CUP_DEPTH_M.toFloat(),
            48
        )
        sceneMeshes += createRenderable(
            liner,
            materialInstance(propMaterial, .86f, .87f, .82f),
            castShadow = false,
            contactShadow = true
        )

        val bottomZ = surfaceZ - V135RigidBallPhysics.CUP_DEPTH_M.toFloat() + .003f
        val bottom = V133Geometry.disc(0f, d.toFloat(), bottomZ, V133CourseSpec.HOLE_RADIUS_M * .96f, 48)
        sceneMeshes += createRenderable(
            bottom,
            materialInstance(propMaterial, .014f, .016f, .014f),
            castShadow = false,
            contactShadow = false
        )

        // Thin white cup edge, just below the turf, catches light without becoming a toy-like ring.
        val innerLip = V133Geometry.ring(
            0f,
            d.toFloat(),
            surfaceZ - .003f,
            V133CourseSpec.HOLE_RADIUS_M * .88f,
            V133CourseSpec.HOLE_RADIUS_M,
            48
        )
        sceneMeshes += createRenderable(
            innerLip,
            materialInstance(propMaterial, .80f, .82f, .77f),
            castShadow = false,
            contactShadow = false
        )

        if (settings.flagstickIn) {
            val pole = V133Geometry.cylinder(
                0f,
                d.toFloat(),
                bottomZ,
                .0065f,
                V133CourseSpec.FLAG_HEIGHT_M + V135RigidBallPhysics.CUP_DEPTH_M.toFloat(),
                14
            )
            sceneMeshes += createRenderable(
                pole,
                materialInstance(propMaterial, .84f, .85f, .81f),
                castShadow = true,
                contactShadow = true
            )

            val flag = V133Geometry.flag(0f, d.toFloat(), surfaceZ + V133CourseSpec.FLAG_HEIGHT_M)
            sceneMeshes += createRenderable(
                flag,
                materialInstance(propMaterial, .62f, .060f, .045f),
                castShadow = true,
                contactShadow = false
            )
        }
    }

    private fun createRenderable''',
              'cup'
          )

          sub(
              r'    private fun updateCameraAndBall\(\) \{.*?\n    \}\n\n    override fun onNativeWindowChanged',
              '''    private fun updateCameraAndBall() {
        val settings = game.settings
        val state = game.state
        val start = V26BallStartRuntime.current(settings)
        val display = TvInstantRollRuntime.displayPosition(state)
        val bx = display?.first ?: state?.x ?: start.first
        val by = display?.second ?: state?.y ?: start.second
        val target = V138CommercialCameraPlanner.target(
            settings.holeDistanceM,
            start.first,
            start.second,
            bx,
            by,
            state,
            game.lastResult
        )
        val heroCupAction = state?.cupPhase == V134CupPhase.RIM ||
            state?.cupPhase == V134CupPhase.DROP ||
            state?.cupPhase == V134CupPhase.SETTLED
        val frame = commercialCamera.step(target, heroCupAction)
        val aspect = viewportWidth.toDouble() / viewportHeight.coerceAtLeast(1).toDouble()
        camera.setProjection(frame.fovDeg.toDouble(), aspect, .025, 120.0, Camera.Fov.VERTICAL)
        camera.lookAt(
            frame.eyeX.toDouble(), frame.eyeY.toDouble(), frame.eyeZ.toDouble(),
            frame.lookX.toDouble(), frame.lookY.toDouble(), frame.lookZ.toDouble(),
            0.0, 0.0, 1.0
        )

        val fallbackCenterZ = GreenTerrain.effectiveHeightAt(settings, bx, by) +
            V133CourseSpec.BALL_RADIUS_M
        val transform = V136BallPose.matrix(state, bx, by, fallbackCenterZ)
        val tm = engine.transformManager
        ballMesh?.let { mesh -> tm.setTransform(tm.getInstance(mesh.entity), transform) }
        ballMarkerMesh?.let { mesh -> tm.setTransform(tm.getInstance(mesh.entity), transform) }
    }

    override fun onNativeWindowChanged''',
              'camera'
          )

          # Ground cells inside the two bunker footprints are removed so depressed sand is visible.
          s = s.replace(
              '                val p0 = point(x0, y0, groundHeight(settings, d, x0, y0))\n                val p1 = point(x1, y0, groundHeight(settings, d, x1, y0))',
              '''                val centerX = (x0 + x1) * .5
                val centerY = (y0 + y1) * .5
                if (bunkerMask(d, centerX, centerY)) continue
                val p0 = point(x0, y0, groundHeight(settings, d, x0, y0))
                val p1 = point(x1, y0, groundHeight(settings, d, x1, y0))'''
          )

          # Increase green density and cut an actual opening around the regulation cup.
          s = s.replace(
              '        val cols = (44 * density).toInt().coerceIn(26, 48)\n        val rows = (92 * density).toInt().coerceIn(52, 100)',
              '        val cols = (58 * density).toInt().coerceIn(34, 62)\n        val rows = (132 * density).toInt().coerceIn(72, 142)'
          )
          s = s.replace(
              '                b.quad(p0, p1, p2, p3, n)\n            }\n        }\n        return b.build()\n    }\n\n    fun ellipseDisc',
              '''                val centerX = (x00 + x10 + x01 + x11) * .25
                val centerY = (y0 + y1) * .5
                val cutRadius = if (fringe) V133CourseSpec.HOLE_RADIUS_M + .018 else V133CourseSpec.HOLE_RADIUS_M + .010
                if (kotlin.math.hypot(centerX, centerY - d) > cutRadius) {
                    b.quad(p0, p1, p2, p3, n)
                }
            }
        }
        return b.build()
    }

    fun ellipseDisc'''
          )

          # Add bunker/cup/tree geometry helpers before the existing sphere primitive.
          anchor = '    fun sphere(cx: Float, cy: Float, cz: Float, radius: Float, latN: Int, lonN: Int): V133GeometryData =\n'
          if s.count(anchor) != 1:
              raise SystemExit('geometry helper anchor mismatch')
          helpers = '''    private fun bunkerMask(d: Double, x: Double, y: Double): Boolean {
        val b1x = -3.05; val b1y = d * .72
        val b2x = 3.20; val b2y = d * .90 + .45
        fun inside(cx: Double, cy: Double, rx: Double, ry: Double): Boolean {
            val dx = (x - cx) / rx
            val dy = (y - cy) / ry
            return dx * dx + dy * dy < 1.05
        }
        return inside(b1x, b1y, 1.04, .55) || inside(b2x, b2y, 1.18, .61)
    }

    fun bunkerBowl(cx: Float, cy: Float, surfaceZ: Float, rx: Float, ry: Float, steps: Int): V133GeometryData {
        val b = V133Builder()
        val n = steps.coerceIn(24, 64)
        val center = point(cx, cy, surfaceZ - .125f)
        for (i in 0 until n) {
            val a0 = 2.0 * PI * i / n
            val a1 = 2.0 * PI * (i + 1) / n
            fun pp(a: Double, scale: Float, z: Float) = point(
                cx + cos(a).toFloat() * rx * scale,
                cy + sin(a).toFloat() * ry * scale,
                z
            )
            val o0 = pp(a0, 1f, surfaceZ)
            val o1 = pp(a1, 1f, surfaceZ)
            val m0 = pp(a0, .76f, surfaceZ - .070f)
            val m1 = pp(a1, .76f, surfaceZ - .070f)
            val i0 = pp(a0, .48f, surfaceZ - .118f)
            val i1 = pp(a1, .48f, surfaceZ - .118f)
            b.quad(o0, o1, m1, m0, normalFromQuad(o0, o1, m0))
            b.quad(m0, m1, i1, i0, normalFromQuad(m0, m1, i0))
            b.tri(center, i1, i0, floatArrayOf(0f, 0f, 1f))
        }
        return b.build()
    }

    fun cupWall(cx: Float, cy: Float, topZ: Float, radius: Float, depth: Float, steps: Int): V133GeometryData {
        val b = V133Builder()
        val n = steps.coerceIn(24, 64)
        val bottomZ = topZ - depth
        for (i in 0 until n) {
            val a0 = 2.0 * PI * i / n
            val a1 = 2.0 * PI * (i + 1) / n
            val t0 = point(cx + cos(a0).toFloat() * radius, cy + sin(a0).toFloat() * radius, topZ)
            val t1 = point(cx + cos(a1).toFloat() * radius, cy + sin(a1).toFloat() * radius, topZ)
            val b0 = point(t0[0], t0[1], bottomZ)
            val b1 = point(t1[0], t1[1], bottomZ)
            val inward = floatArrayOf(-cos((a0 + a1) * .5).toFloat(), -sin((a0 + a1) * .5).toFloat(), 0f)
            // Double winding makes the liner visible from both the low cup camera and above.
            b.quad(t1, t0, b0, b1, inward)
            b.quad(t0, t1, b1, b0, floatArrayOf(-inward[0], -inward[1], 0f))
        }
        return b.build()
    }

    fun cone(cx: Float, cy: Float, baseZ: Float, radius: Float, height: Float, steps: Int): V133GeometryData {
        val b = V133Builder()
        val n = steps.coerceIn(10, 32)
        val apex = point(cx, cy, baseZ + height)
        for (i in 0 until n) {
            val a0 = 2.0 * PI * i / n
            val a1 = 2.0 * PI * (i + 1) / n
            val p0 = point(cx + cos(a0).toFloat() * radius, cy + sin(a0).toFloat() * radius, baseZ)
            val p1 = point(cx + cos(a1).toFloat() * radius, cy + sin(a1).toFloat() * radius, baseZ)
            val mid = (a0 + a1) * .5
            val normal = floatArrayOf(cos(mid).toFloat(), sin(mid).toFloat(), (radius / height).coerceAtLeast(.05f))
            b.tri(p0, p1, apex, normal)
        }
        return b.build()
    }

'''
          s = s.replace(anchor, helpers + anchor, 1)

          p.write_text(s)
          PY

          git diff --check
          if git diff --quiet; then
            echo 'No product patch required.'
            exit 0
          fi
