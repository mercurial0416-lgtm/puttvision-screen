name: Verify private signing escrow retrieval

on:
  push:
    branches: [ agent/signing-escrow-read-check ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download signing escrow with repository token only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == true and .tag_name == "puttvision-signing-vault-v1") | .assets[] | select(.name == "puttvision-signing-bundle.tgz") | .id' | head -1)
          if [ -z "$ASSET_ID" ]; then
            echo "Private signing escrow asset not found" >&2
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/signing-bundle.tgz"
          test -s "$RUNNER_TEMP/signing-bundle.tgz"
          mkdir -p "$RUNNER_TEMP/signing"
          tar -xzf "$RUNNER_TEMP/signing-bundle.tgz" -C "$RUNNER_TEMP/signing"
          set -a
          source "$RUNNER_TEMP/signing/signing.env"
          set +a
          keytool -list \
            -keystore "$RUNNER_TEMP/signing/release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          test -s "$RUNNER_TEMP/signing/signing-lineage"
          echo "Private signing escrow retrieval verified"
