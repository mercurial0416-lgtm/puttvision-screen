name: Solo accuracy and release verify

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'agent/v34-*', 'agent/v35-*', 'agent/solo-*' ]

permissions:
  contents: read

concurrency:
  group: solo-release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked signing material
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/).+\.(jks|keystore)$|(^|/)ci/.+\.jks\.b64$' || true)
          if [ -n "$forbidden" ]; then
            echo "Tracked signing material is forbidden:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

      - name: Reject release-signing fallback credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE "PUTTVISION_(STORE_PASSWORD|KEY_PASSWORD|KEY_ALIAS).*\|\|" .github/workflows/release-apk.yml; then
            echo "Release signing secrets must not have fallback values" >&2
            exit 1
          fi
          # The release workflow may recover a lost key by generating random credentials inside the
          # ephemeral runner, but it must persist them only in a private draft signing escrow.
          grep -q 'Restore or bootstrap release signing bundle' .github/workflows/release-apk.yml
          grep -q 'puttvision-signing-vault-v2' .github/workflows/release-apk.yml
          grep -q 'openssl rand -hex 32' .github/workflows/release-apk.yml
          grep -q -- '--draft' .github/workflows/release-apk.yml
          grep -q 'chmod 600' .github/workflows/release-apk.yml

      - name: Require release accuracy regression gate wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/v20_accuracy_gate.py
          grep -q 'Real-device measurement regression gate' .github/workflows/release-apk.yml
          grep -q 'python3 ci/v20_accuracy_gate.py' .github/workflows/release-apk.yml
          grep -q 'Accuracy fixture set is incomplete' .github/workflows/release-apk.yml

      - name: Accuracy gate self-tests
        run: python3 -m unittest ci.test_v20_accuracy_gate

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Kotlin regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
