name: Solo accuracy and release verify

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'agent/v34-*', 'agent/v35-*', 'agent/solo-*' ]

permissions:
  contents: read

concurrency:
  group: solo-release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked signing material
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/).+\.(jks|keystore)$|(^|/)ci/.+\.jks\.b64$' || true)
          if [ -n "$forbidden" ]; then
            echo "Tracked signing material is forbidden:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

      - name: Enforce current-main release signer continuity
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/current-main-release.yml
          test -f "$workflow"
          if grep -nE 'openssl rand -hex|keytool -genkeypair|bootstrapping a persistent replacement release key|Restore or bootstrap release signing bundle' "$workflow"; then
            echo "Release CI must never generate a replacement Android signing identity" >&2
            exit 1
          fi
          grep -q 'Restore release signing bundle' "$workflow"
          grep -q 'puttvision-signing-vault-v3' "$workflow"
          grep -q 'signing-lineage' "$workflow"
          grep -q -- '--lineage' "$workflow"
          grep -q '7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb' "$workflow"
          if grep -q 'puttvision-signing-vault-v1\|puttvision-signing-vault-v2' "$workflow"; then
            echo "Release CI must not fall back to broken pre-v3 signing vault selection" >&2
            exit 1
          fi

      - name: Require current-main release regression gate wiring
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/current-main-release.yml
          test -f ci/v20_accuracy_gate.py
          grep -q 'Release regression tests' "$workflow"
          grep -q 'gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest' "$workflow"
          grep -q 'Ensure pinned source is still current main' "$workflow"
          grep -q 'Ensure updater still targets current main' "$workflow"
          grep -q 'Verify final release/updater contract' "$workflow"

      - name: Accuracy gate self-tests
        run: python3 -m unittest ci.test_v20_accuracy_gate

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Kotlin regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
