name: Verify PuttVision V10 final temp

on:
  push:
    branches: [ v10-actual ]
    paths:
      - '.github/workflows/v10-final-verify-temp.yml'

permissions:
  contents: write

jobs:
  verify-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-actual
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V10 app patch
        run: |
          python .v10/apply_v10.py
          python .v10/fixups_v10.py
      - name: Diff sanity
        run: git diff --check
      - name: Full V10 unit regression
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile consumer and developer
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V10 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          test -n "$(git status --porcelain app)"
          git commit -m 'feat: V10 adaptive precision recovery and physics green read'
          git pull --rebase origin v10-actual
          git push origin HEAD:v10-actual
