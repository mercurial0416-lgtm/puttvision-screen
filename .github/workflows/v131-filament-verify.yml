name: V143 split manifest settle

on:
  pull_request:
    paths:
      - '.github/workflows/v131-filament-verify.yml'

permissions:
  contents: write

concurrency:
  group: v143-split-manifest-settle
  cancel-in-progress: false

jobs:
  settle:
    if: ${{ github.head_ref == 'release/v143-pr-deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-publish bridge manifest idempotently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        run: |
          set -euo pipefail
          jq -nc \
            --arg action finalize \
            --argjson vc 100178 \
            --arg vn 0.7.178 \
            --arg sha 98ae79733cb6900f7656a651bfc44db78353665a8c197abb6f30add2ac780650 \
            --argjson size 37157578 \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}' > payload.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" \
            -H 'content-type: application/json' \
            -H "x-github-token: $GH_TOKEN" \
            --data-binary @payload.json > finalize.json
          cat finalize.json | jq .
          jq -e '.ok == true and .action == "finalize" and .versionCode == 100178' finalize.json >/dev/null

      - name: Wait for public manifests to converge
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_URL=https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update.json
          V2_URL=https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update-v2.json
          ok=0
          for i in $(seq 1 18); do
            bust=$(date +%s%N)
            LEGACY=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$LEGACY_URL?settle=$bust" || true)
            V2=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$V2_URL?settle=$bust" || true)
            echo "attempt=$i legacy=$(echo "$LEGACY" | jq -r '.versionCode // "?"' 2>/dev/null || echo '?') v2=$(echo "$V2" | jq -r '.versionCode // "?"' 2>/dev/null || echo '?')"
            if echo "$LEGACY" | jq -e '.versionCode == 100178 and .sha256 == "98ae79733cb6900f7656a651bfc44db78353665a8c197abb6f30add2ac780650"' >/dev/null 2>&1 \
              && echo "$V2" | jq -e '.versionCode == 100179 and .sha256 == "46a833e6d96d666aceb2ba85cd8905bc3a8eac1458f370b576eca7453824f48c"' >/dev/null 2>&1; then
              ok=1
              echo "$LEGACY" | jq .
              echo "$V2" | jq .
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
