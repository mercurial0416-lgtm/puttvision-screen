name: TV renderer verify

on:
  push:
    branches: [ 'agent/filament-*' ]
  pull_request:
    paths:
      - 'app/**'
      - 'ci/v143_fetch_cc0_assets.py'
      - '.github/workflows/v131-filament-verify.yml'

permissions:
  contents: read

concurrency:
  group: tv-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fetch V143 CC0 visual assets
        run: python3 ci/v143_fetch_cc0_assets.py

      - name: Upload resolved V143 CC0 assets
        uses: actions/upload-artifact@v4
        with:
          name: v143-cc0-assets
          path: app/src/main/assets/v143_assets
          if-no-files-found: error
          retention-days: 7

      - name: Validate V143 Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          curl --fail-with-body -L --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT=$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)
          test -x "$GODOT"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --headless --editor --path app/src/main/assets --quit
          "$GODOT" --headless --path app/src/main/assets --script res://v143_tv.gd --check-only
          SMOKE="$RUNNER_TEMP/v143-smoke.log"
          "$GODOT" --headless --path app/src/main/assets --quit-after 2 res://v143_tv.tscn 2>&1 | tee "$SMOKE"
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid assignment|Invalid call|Cannot assign' "$SMOKE"; then
            echo "V143 runtime smoke detected a GDScript error" >&2
            exit 1
          fi

      - name: Render V143 reference frame and run visual regression self-tests
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null
          rm -f app/src/main/assets/v143-preview.png
          PREVIEW_LOG="$RUNNER_TEMP/v143-preview.log"
          timeout 45s xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render" \
            "$GODOT_BIN" \
              --path app/src/main/assets \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --resolution 1920x1080 \
              --fixed-fps 30 \
              res://v143_preview.tscn 2>&1 | tee "$PREVIEW_LOG"
          test -s app/src/main/assets/v143-preview.png
          grep -q 'V171_PROFILE_SWITCH_OK=' "$PREVIEW_LOG"
          grep -q 'V173_PREMIUM_NODES_OK=1' "$PREVIEW_LOG"
          grep -q 'V174_BROADCAST_HUD_OK=1' "$PREVIEW_LOG"
          grep -q 'V175_CINEMATIC_REPLAY_OK=1' "$PREVIEW_LOG"
          grep -q 'V176_PRECISION_READ_OK=1' "$PREVIEW_LOG"
          grep -q 'V177_SHOT_DEBRIEF_OK=1' "$PREVIEW_LOG"
          grep -q 'PRACTICE_TARGET_WINDOW_OK=1' "$PREVIEW_LOG"
          grep -q 'PRACTICE_PRESSURE_LADDER_OK=1' "$PREVIEW_LOG"
          grep -q 'PRACTICE_DRILL_PROGRESSION_OK=1' "$PREVIEW_LOG"
          grep -q 'PRACTICE_BEST_REP_GHOST_OK=1' "$PREVIEW_LOG"
          grep -q 'PRACTICE_DISPERSION_ENVELOPE_OK=1' "$PREVIEW_LOG"
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Invalid assignment|Invalid call|Cannot assign|push_error' "$PREVIEW_LOG"; then
            echo "V143 preview regression detected a GDScript error" >&2
            exit 1
          fi

      - name: Upload V143 reference frame
        uses: actions/upload-artifact@v4
        with:
          name: v143-godot-preview
          path: app/src/main/assets/v143-preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Consumer and developer unit tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Compile both debug APK flavors
        run: gradle assembleConsumerDebug assembleDeveloperDebug

      - name: Enforce engine-aware self-update size ceiling
        shell: bash
        env:
          PV_EXTERNAL_SIGNING: 'true'
        run: |
          set -euo pipefail
          gradle assembleConsumerRelease
          APK=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "consumer release bytes=$BYTES"
          # V143 embeds one ARM64 Godot runtime plus CC0 environment assets. Keep a hard ceiling so
          # future additions remain deliberate while leaving a real game-engine asset budget.
          test "$BYTES" -lt $((180 * 1024 * 1024))
