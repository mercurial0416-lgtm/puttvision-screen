name: TV renderer verify

on:
  push:
    branches: [ 'agent/filament-*' ]
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/v131-filament-verify.yml'

permissions:
  contents: read

concurrency:
  group: tv-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate V143 Godot project
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          curl --fail-with-body -L --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT=$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)
          test -x "$GODOT"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --headless --editor --path app/src/main/assets --quit

      - name: Render V143 reference frame
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot xdotool
          rm -f app/src/main/assets/v143-preview.png
          LOG="$RUNNER_TEMP/v143-godot.log"
          export GODOT_BIN LOG
          timeout 40s xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render" bash -lc '
            set -euo pipefail
            "$GODOT_BIN" \
              --path app/src/main/assets \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --resolution 1920x1080 \
              res://v143_tv.tscn >"$LOG" 2>&1 &
            PID=$!
            trap "kill $PID 2>/dev/null || true" EXIT
            for i in $(seq 1 20); do
              sleep 0.5
              if xdotool search --name "PuttVision TV" >/dev/null 2>&1; then break; fi
            done
            sleep 2
            scrot -z app/src/main/assets/v143-preview.png
            test -s app/src/main/assets/v143-preview.png
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          '
          cat "$LOG" || true
          test -s app/src/main/assets/v143-preview.png

      - name: Upload V143 reference frame
        uses: actions/upload-artifact@v4
        with:
          name: v143-godot-preview
          path: app/src/main/assets/v143-preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Consumer and developer unit tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Compile both debug APK flavors
        run: gradle assembleConsumerDebug assembleDeveloperDebug

      - name: Enforce engine-aware self-update size ceiling
        shell: bash
        env:
          PV_EXTERNAL_SIGNING: 'true'
        run: |
          set -euo pipefail
          gradle assembleConsumerRelease
          APK=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "consumer release bytes=$BYTES"
          # V143 embeds one ARM64 Godot runtime (~110 MB total APK today). Keep a hard ceiling so
          # future art/runtime additions remain deliberate while allowing a real engine asset budget.
          test "$BYTES" -lt $((160 * 1024 * 1024))
