name: V131 Filament verify

on:
  push:
    branches: [ 'agent/filament-*' ]
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/v131-filament-verify.yml'

permissions:
  contents: read

concurrency:
  group: v131-filament-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: V131 consumer and developer unit tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Compile both debug APK flavors
        run: gradle assembleConsumerDebug assembleDeveloperDebug

      - name: Enforce self-update release size ceiling
        shell: bash
        env:
          PV_EXTERNAL_SIGNING: 'true'
        run: |
          set -euo pipefail
          gradle assembleConsumerRelease
          APK=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "consumer release bytes=$BYTES"
          test "$BYTES" -lt $((48 * 1024 * 1024))
