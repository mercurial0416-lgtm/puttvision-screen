name: V140 Friends public-reference scene patch

on:
  push:
    branches:
      - agent/v140-friends-public-reference-scene

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v140-friends-public-reference-scene
          fetch-depth: 0
      - name: Apply V140 Friends public-reference 3D scene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/puttvision/screen/V138CommercialScreenGolf.kt')
          s = p.read_text()
          if 'V140 Friends public-reference backdrop' in s:
              print('V140 scene already applied')
              raise SystemExit(0)

          replacements = [
              ('addView(V139FriendsHud(context, game), LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT))',
               'addView(V140FriendsHud(context, game), LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.MATCH_PARENT))'),
              ('private val cameraSmoother = V139FriendsCameraSmoother()',
               'private val cameraSmoother = V140FriendsCameraSmoother()'),
              ('V139FriendsCameraPlanner.target(', 'V140FriendsCameraPlanner.target('),
              ('Skybox.Builder().color(.47f, .67f, .82f, 1f)', 'Skybox.Builder().color(.16f, .38f, .75f, 1f)'),
              ('camera.setExposure(10.15f, 1f / 125f, 100f)', 'camera.setExposure(9.65f, 1f / 125f, 100f)'),
              ('instance(turfMaterial, .108f, .258f, .067f)', 'instance(turfMaterial, .115f, .320f, .070f)'),
              ('instance(turfMaterial, .155f, .355f, .092f)', 'instance(turfMaterial, .180f, .435f, .095f)'),
              ('instance(turfMaterial, .205f, .468f, .118f)', 'instance(turfMaterial, .255f, .565f, .125f)'),
              ('        addBunkers(settings, d)\n        addVegetation(settings, d, tier)\n        addCup(settings, d)',
               '        addFriendsReferenceBackdrop(settings, d, tier)\n        addCup(settings, d)')
          ]
          for old, new in replacements:
              count = s.count(old)
              if count == 0 and new in s:
                  continue
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {count}')
              s = s.replace(old, new, 1)

          marker = '    private fun addBunkers(settings: GreenSettings, d: Double) {'
          if marker not in s:
              raise SystemExit('addBunkers marker missing')
          backdrop = r'''    // V140 Friends public-reference backdrop: reconstructed from the public Kakao VX
    // putting still using original primitive geometry only. No extracted meshes/textures are used.
    private fun addFriendsReferenceBackdrop(settings: GreenSettings, d: Double, tier: V24RenderTier) {
        val houseY = (d + 6.6).toFloat()
        val houseX = -3.25f
        val houseGround = V138Geometry.groundHeight(settings, d, houseX.toDouble(), houseY.toDouble())

        // Low clubhouse left of center, matching the dominant horizon landmark in the public still.
        sceneMeshes += createRenderable(
            V138Geometry.box(houseX, houseY, houseGround + .62f, 1.72f, .82f, .62f),
            instance(litMaterial, .78f, .77f, .69f), true, true
        )
        sceneMeshes += createRenderable(
            V138Geometry.gableRoof(houseX, houseY, houseGround + 1.24f, 1.92f, .96f, .48f),
            instance(litMaterial, .27f, .26f, .28f), true, true
        )
        sceneMeshes += createRenderable(
            V138Geometry.box(houseX - 1.05f, houseY + .10f, houseGround + 1.78f, .16f, .16f, .46f),
            instance(litMaterial, .83f, .82f, .75f), true, true
        )
        for (i in 0..3) {
            val wx = houseX - 1.10f + i * .73f
            sceneMeshes += createRenderable(
                V138Geometry.box(wx, houseY - .835f, houseGround + .72f, .22f, .028f, .25f),
                instance(litMaterial, .10f, .16f, .18f), false, false
            )
        }

        // White rail fence running behind the flag.
        val fenceY = (d + 3.35).toFloat()
        val fenceGround = V138Geometry.groundHeight(settings, d, 0.0, fenceY.toDouble())
        for (x in -6..6 step 2) {
            sceneMeshes += createRenderable(
                V138Geometry.box(x.toFloat(), fenceY, fenceGround + .34f, .035f, .035f, .34f),
                instance(litMaterial, .88f, .88f, .82f), true, true
            )
        }
        for (z in listOf(.24f, .48f)) {
            sceneMeshes += createRenderable(
                V138Geometry.box(0f, fenceY, fenceGround + z, 6.05f, .030f, .028f),
                instance(litMaterial, .88f, .88f, .82f), true, false
            )
        }

        // Flower bed visible as a thin colourful band in front of the fence.
        val flowerCount = when (tier) {
            V24RenderTier.HIGH -> 28
            V24RenderTier.BALANCED -> 20
            V24RenderTier.PERFORMANCE -> 12
        }
        for (i in 0 until flowerCount) {
            val t = if (flowerCount <= 1) .5f else i.toFloat() / (flowerCount - 1)
            val x = -5.4f + 10.8f * t
            val y = fenceY - .30f + .08f * sin(i * 1.71f)
            val g = V138Geometry.groundHeight(settings, d, x.toDouble(), y.toDouble())
            val tone = when (i % 4) {
                0 -> floatArrayOf(.86f, .25f, .47f)
                1 -> floatArrayOf(.96f, .72f, .82f)
                2 -> floatArrayOf(.92f, .90f, .72f)
                else -> floatArrayOf(.70f, .22f, .44f)
            }
            sceneMeshes += createRenderable(
                V138Geometry.ellipsoid(x, y, g + .16f, .10f, .08f, .10f, 6, 10),
                instance(litMaterial, tone[0], tone[1], tone[2]), true, false
            )
        }

        // Large horizon trees: sparse, broad crowns rather than many toy-scale repeated trees.
        val treeSpecs = listOf(
            floatArrayOf(-6.0f, (d + 5.1).toFloat(), 1.15f, .08f, .28f, .07f),
            floatArrayOf(-4.7f, (d + 7.1).toFloat(), 1.45f, .10f, .34f, .08f),
            floatArrayOf(-.7f, (d + 6.2).toFloat(), 1.35f, .10f, .36f, .09f),
            floatArrayOf(1.55f, (d + 6.9).toFloat(), 1.30f, .09f, .34f, .08f),
            floatArrayOf(3.25f, (d + 5.8).toFloat(), 1.28f, .44f, .13f, .12f),
            floatArrayOf(5.0f, (d + 7.0).toFloat(), 1.45f, .10f, .31f, .08f),
            floatArrayOf(6.2f, (d + 5.0).toFloat(), 1.10f, .08f, .28f, .07f)
        )
        treeSpecs.forEachIndexed { index, a ->
            val x = a[0]; val y = a[1]; val scale = a[2]
            val g = V138Geometry.groundHeight(settings, d, x.toDouble(), y.toDouble())
            sceneMeshes += createRenderable(
                V138Geometry.cylinder(x, y, g, .075f * scale, .92f * scale, 12),
                instance(litMaterial, .20f, .12f, .055f), true, true
            )
            val crownZ = g + 1.12f * scale
            val lobes = listOf(-.38f to .02f, .34f to .02f, -.05f to .28f)
            lobes.forEachIndexed { li, pair ->
                val redTree = index == 4
                val r = if (redTree) a[3] + li * .025f else a[3] + li * .008f
                val gg = if (redTree) a[4] + li * .010f else a[4] + li * .014f
                val bb = if (redTree) a[5] + li * .014f else a[5] + li * .006f
                sceneMeshes += createRenderable(
                    V138Geometry.ellipsoid(
                        x + pair.first * scale,
                        y + pair.second * scale,
                        crownZ + li * .17f * scale,
                        .72f * scale,
                        .56f * scale,
                        .72f * scale,
                        9,
                        15
                    ),
                    instance(litMaterial, r, gg, bb), true, false
                )
            }
        }

        // Bright cloud masses against the deeper blue sky in the public still.
        val cloudY = (d + 18.0).toFloat()
        val clouds = listOf(
            floatArrayOf(-5.0f, cloudY, 4.4f, 1.7f, .58f, .48f),
            floatArrayOf(-3.6f, cloudY + .4f, 4.65f, 1.25f, .52f, .42f),
            floatArrayOf(3.8f, cloudY + .2f, 4.9f, 1.8f, .62f, .50f),
            floatArrayOf(5.2f, cloudY + .5f, 5.15f, 1.15f, .48f, .40f)
        )
        clouds.forEach { c ->
            sceneMeshes += createRenderable(
                V138Geometry.ellipsoid(c[0], c[1], c[2], c[3], c[4], c[5], 8, 16),
                instance(litMaterial, .93f, .94f, .95f), false, false
            )
        }
    }

'''
          s = s.replace(marker, backdrop + marker, 1)

          geom_marker = '    fun disc(cx: Float, cy: Float, cz: Float, radius: Float, steps: Int): V138GeometryData {'
          if geom_marker not in s:
              raise SystemExit('disc marker missing')
          primitives = r'''    fun box(cx: Float, cy: Float, cz: Float, hx: Float, hy: Float, hz: Float): V138GeometryData {
        val b = V138Builder()
        val x0 = cx - hx; val x1 = cx + hx
        val y0 = cy - hy; val y1 = cy + hy
        val z0 = cz - hz; val z1 = cz + hz
        val p000 = p(x0, y0, z0); val p100 = p(x1, y0, z0)
        val p110 = p(x1, y1, z0); val p010 = p(x0, y1, z0)
        val p001 = p(x0, y0, z1); val p101 = p(x1, y0, z1)
        val p111 = p(x1, y1, z1); val p011 = p(x0, y1, z1)
        b.quad(p000, p100, p101, p001, floatArrayOf(0f, -1f, 0f))
        b.quad(p110, p010, p011, p111, floatArrayOf(0f, 1f, 0f))
        b.quad(p010, p000, p001, p011, floatArrayOf(-1f, 0f, 0f))
        b.quad(p100, p110, p111, p101, floatArrayOf(1f, 0f, 0f))
        b.quad(p001, p101, p111, p011, floatArrayOf(0f, 0f, 1f))
        b.quad(p010, p110, p100, p000, floatArrayOf(0f, 0f, -1f))
        return b.build()
    }

    fun gableRoof(cx: Float, cy: Float, baseZ: Float, hx: Float, hy: Float, roofH: Float): V138GeometryData {
        val b = V138Builder()
        val lf = p(cx - hx, cy - hy, baseZ)
        val rf = p(cx + hx, cy - hy, baseZ)
        val lb = p(cx - hx, cy + hy, baseZ)
        val rb = p(cx + hx, cy + hy, baseZ)
        val lr = p(cx - hx, cy, baseZ + roofH)
        val rr = p(cx + hx, cy, baseZ + roofH)
        b.quad(lf, rf, rr, lr, floatArrayOf(0f, -roofH, hy))
        b.quad(rb, lb, lr, rr, floatArrayOf(0f, roofH, hy))
        b.tri(lf, lr, lb, floatArrayOf(-1f, 0f, .25f))
        b.tri(rf, rb, rr, floatArrayOf(1f, 0f, .25f))
        return b.build()
    }

'''
          s = s.replace(geom_marker, primitives + geom_marker, 1)
          p.write_text(s)
          PY

          git config user.name "puttvision-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/puttvision/screen/V138CommercialScreenGolf.kt
          if git diff --cached --quiet; then
            echo "V140 renderer already patched"
            exit 0
          fi
          git commit -m "V140: reconstruct Friends public-reference putting scene"
          git push origin HEAD:agent/v140-friends-public-reference-scene
