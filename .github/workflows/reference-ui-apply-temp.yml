name: Apply reference UI temp

on:
  push:
    branches: [ reference-ui-rebuild ]
    paths: [ '.github/workflows/reference-ui-apply-temp.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Patch MainActivity from staged snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/puttvision/screen/MainActivity.kt')
          s = p.read_text()
          def replace_between(src, start_marker, next_marker, replacement):
              a = src.index(start_marker)
              b = src.index(next_marker, a)
              return src[:a] + replacement.rstrip() + '\n\n    ' + src[b:]
          s = replace_between(s, 'private fun buildUi() {', 'private fun buildSmartPuttMenu', Path('.ui-patch/buildUi.txt').read_text())
          s = replace_between(s, 'private fun buildVideoHomeScreen(): View {', 'private fun sectionPanel', Path('.ui-patch/home.txt').read_text())
          p.write_text(s)
          PY

      - name: Compile verification
        run: gradle assembleDebug

      - name: Commit verified UI
        shell: bash
        run: |
          rm -rf .ui-patch
          rm -f .github/workflows/reference-ui-apply-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: match PuttVision reference UI"
          git push origin HEAD:reference-ui-rebuild
