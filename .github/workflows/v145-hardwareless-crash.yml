name: V145 hardwareless crash hotfix

on:
  pull_request:
    paths:
      - 'app/**'
      - 'ci/v143_fetch_cc0_assets.py'
      - '.github/workflows/v145-hardwareless-crash.yml'

permissions:
  contents: write

jobs:
  verify-release:
    if: ${{ github.head_ref == 'hotfix/v145-hardwareless-crash-181' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v145-hardwareless-crash-181
          fetch-depth: 0

      - name: Verify V145 crash guards
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'android:process=":hardwareless"' app/src/main/AndroidManifest.xml
          grep -q 'private var godotReady = false' app/src/main/java/com/puttvision/screen/V144HardwarelessGodotActivity.kt
          grep -q 'private fun maybeStartPump()' app/src/main/java/com/puttvision/screen/V144HardwarelessGodotActivity.kt
          grep -q 'V26BallStartRuntime.install(applicationContext)' app/src/main/java/com/puttvision/screen/V144HardwarelessGodotActivity.kt
          grep -q 'super.onCreate(savedInstanceState)' app/src/main/java/com/puttvision/screen/V144HardwarelessGodotActivity.kt
          git diff --check origin/main...HEAD

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve V143 visual assets
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/v143_fetch_cc0_assets.py
          test -s app/src/main/assets/v143_assets/turf/albedo.png
          test -s app/src/main/assets/v143_assets/turf/normal.png
          test -s app/src/main/assets/v143_assets/turf/roughness.png
          test -s app/src/main/assets/v143_assets/trees/tree_small_02.png
          test -s app/src/main/assets/v143_assets/trees/island_tree_03.png
          test -s app/src/main/assets/v143_assets/environment/environment.hdr

      - name: Test and compile 0.7.181
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
          PV_VERSION_CODE: '100181'
          PV_VERSION_NAME: '0.7.181'
        shell: bash
        run: |
          set -euo pipefail
          gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
          gradle assembleConsumerDebug assembleDeveloperDebug
          gradle assembleConsumerRelease
          APK=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "unsigned consumer release bytes=$BYTES"
          test "$BYTES" -lt $((180 * 1024 * 1024))
          echo "PV_RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore release signing lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/signing-v3.tgz"
          DIR="$RUNNER_TEMP/signing-v3"
          ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "puttvision-signing-vault-v3") | .assets[] | select(.name == "puttvision-signing-bundle-v3.tgz" or .label == "puttvision-signing-bundle.tgz") | .id' | head -1)
          test -n "$ASSET_ID"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$BUNDLE"
          test -s "$BUNDLE"
          mkdir -p "$DIR"
          tar -xzf "$BUNDLE" -C "$DIR"
          test -s "$DIR/release.jks"
          test -s "$DIR/signing-lineage"
          test -s "$DIR/signing.env"
          chmod 600 "$DIR/release.jks" "$DIR/signing-lineage" "$DIR/signing.env"
          set -a; source "$DIR/signing.env"; set +a
          for n in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS ROTATION_MIN_SDK; do test -n "${!n:-}"; done
          test "$ROTATION_MIN_SDK" = 28
          CERT=$(keytool -exportcert -keystore "$DIR/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          test "$CERT" = '7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb'
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          chmod 600 "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
          echo "PV_SIGNING_DIR=$DIR" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PV_ROTATION_MIN_SDK=$ROTATION_MIN_SDK" >> "$GITHUB_ENV"

      - name: Sign and verify 0.7.181 consumer APK
        shell: bash
        run: |
          set -euo pipefail
          A=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)
          C=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$A"; test -s "$C"
          "$A" sign --ks "$PV_SIGNING_DIR/release.jks" --ks-key-alias "$PV_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --lineage "$PV_SIGNING_DIR/signing-lineage" --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK" --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false --out puttvision-consumer.apk "$C"
          "$A" verify --verbose --print-certs --min-sdk-version 28 puttvision-consumer.apk
          CERT=$("$A" verify --print-certs puttvision-consumer.apk 2>&1 | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]')
          test "$CERT" = '7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb'
          SIZE=$(stat -c%s puttvision-consumer.apk)
          test "$SIZE" -lt $((180 * 1024 * 1024))
          SHA=$(sha256sum puttvision-consumer.apk | cut -d' ' -f1)
          echo "$SHA  puttvision-consumer.apk" > puttvision-consumer.apk.sha256
          echo "PV_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "PV_RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "PV_APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/pv-100181/puttvision-consumer.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release pv-100181
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view pv-100181 >/dev/null 2>&1; then
            gh release upload pv-100181 puttvision-consumer.apk puttvision-consumer.apk.sha256 --clobber
            gh release edit pv-100181 --title 'PuttVision 0.7.181' --notes 'V145 · Fix SIM LAB crash by sharing app runtime state and gating physics until Godot setup is complete.' --latest
          else
            gh release create pv-100181 puttvision-consumer.apk puttvision-consumer.apk.sha256 --target "$PV_RELEASE_TARGET" --title 'PuttVision 0.7.181' --notes 'V145 · Fix SIM LAB crash by sharing app runtime state and gating physics until Godot setup is complete.' --latest
          fi
          curl --fail-with-body -sSIL "$PV_APK_URL" >/dev/null

      - name: Publish external update channel 100181
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        run: |
          set -euo pipefail
          jq -nc --arg action external-finalize --argjson vc 100181 --arg vn '0.7.181' --arg sha "$PV_RELEASE_SHA" --argjson size "$PV_APK_SIZE" --arg apkUrl "$PV_APK_URL" '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size,apkUrl:$apkUrl}' > payload.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" -H 'content-type: application/json' -H "x-github-token: $GH_TOKEN" --data-binary @payload.json > finalize.json
          cat finalize.json | jq .
          jq -e '.ok == true and .action == "external-finalize" and .versionCode == 100181' finalize.json >/dev/null
          V2=https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update-v2.json
          ok=0
          for i in $(seq 1 24); do
            LIVE=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$V2?settle=$(date +%s%N)" || true)
            if echo "$LIVE" | jq -e --arg sha "$PV_RELEASE_SHA" --arg url "$PV_APK_URL" '.versionCode == 100181 and .versionName == "0.7.181" and .sha256 == $sha and .apkUrl == $url' >/dev/null 2>&1; then
              echo "$LIVE" | jq .
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
