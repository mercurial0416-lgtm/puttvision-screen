name: Current main release

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: puttvision-current-main-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.issue.number == 138 && github.event.comment.body == '/release-current-main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pin current main source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "PV_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Allocate semantic release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          LAST=${TAG#pv-}
          [[ "$LAST" =~ ^[0-9]+$ ]]
          VERSION_CODE=$((LAST + 1))
          VERSION_NAME="0.7.$((VERSION_CODE - 100000))"
          echo "PV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PV_TAG=pv-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Release regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Restore release signing bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/signing-v3.tgz"
          DIR="$RUNNER_TEMP/signing-v3"
          ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "puttvision-signing-vault-v3") | .assets[] | select(.name == "puttvision-signing-bundle-v3.tgz" or .label == "puttvision-signing-bundle.tgz") | .id' | head -1)
          test -n "$ASSET_ID"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$BUNDLE"
          test -s "$BUNDLE"
          mkdir -p "$DIR"
          tar -xzf "$BUNDLE" -C "$DIR"
          test -s "$DIR/release.jks"
          test -s "$DIR/signing-lineage"
          test -s "$DIR/signing.env"
          chmod 600 "$DIR/release.jks" "$DIR/signing-lineage" "$DIR/signing.env"
          set -a; source "$DIR/signing.env"; set +a
          for n in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS ROTATION_MIN_SDK; do test -n "${!n:-}"; done
          test "$ROTATION_MIN_SDK" = 28
          CERT=$(keytool -exportcert -keystore "$DIR/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          test "$CERT" = "7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb"
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          chmod 600 "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
          echo "PV_SIGNING_DIR=$DIR" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PV_ROTATION_MIN_SDK=$ROTATION_MIN_SDK" >> "$GITHUB_ENV"

      - name: Build current main APKs
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_VERSION_CODE: ${{ env.PV_VERSION_CODE }}
          PV_VERSION_NAME: ${{ env.PV_VERSION_NAME }}
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
        run: gradle assembleConsumerRelease assembleDeveloperRelease

      - name: Sign and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          A=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)
          C=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          D=$(find app/build/outputs/apk/developer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$C"; test -s "$D"
          sign_one() {
            "$A" sign --ks "$PV_SIGNING_DIR/release.jks" --ks-key-alias "$PV_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --lineage "$PV_SIGNING_DIR/signing-lineage" --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK" --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false --out "$2" "$1"
            "$A" verify --verbose --print-certs --min-sdk-version 28 "$2"
          }
          sign_one "$C" puttvision-consumer.apk
          sign_one "$D" puttvision.apk
          sha256sum puttvision-consumer.apk > puttvision-consumer.apk.sha256
          sha256sum puttvision.apk > puttvision.apk.sha256
          echo "PV_RELEASE_SHA=$(cut -d' ' -f1 puttvision-consumer.apk.sha256)" >> "$GITHUB_ENV"
          echo "PV_APK_SIZE=$(stat -c%s puttvision-consumer.apk)" >> "$GITHUB_ENV"

      - name: Verify signed APK version metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          verify_version() {
            local apk="$1"
            local badging
            badging=$("$AAPT" dump badging "$apk" | head -1)
            [[ "$badging" == *"versionCode='$PV_VERSION_CODE'"* ]]
            [[ "$badging" == *"versionName='$PV_VERSION_NAME'"* ]]
          }
          verify_version puttvision-consumer.apk
          verify_version puttvision.apk

      - name: Ensure pinned source is still current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIVE_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$LIVE_MAIN_SHA" != "$PV_SOURCE_SHA" ]]; then
            echo "main advanced during release: pinned=$PV_SOURCE_SHA live=$LIVE_MAIN_SHA" >&2
            exit 1
          fi

      - name: Publish semantic GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(puttvision.apk puttvision.apk.sha256 puttvision-consumer.apk puttvision-consumer.apk.sha256)
          gh release create "$PV_TAG" "${ASSETS[@]}" --target "$PV_SOURCE_SHA" --title "PuttVision $PV_VERSION_NAME" --notes "Current main production release" --latest
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$PV_TAG/puttvision-consumer.apk"
          echo "PV_APK_URL=$APK_URL" >> "$GITHUB_ENV"
          curl --fail-with-body -sSIL "$APK_URL" >/dev/null

      - name: Verify published APK integrity
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER_URL="$PV_APK_URL"
          DEVELOPER_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$PV_TAG/puttvision.apk"
          PUBLISHED_CONSUMER="$RUNNER_TEMP/published-puttvision-consumer.apk"
          PUBLISHED_DEVELOPER="$RUNNER_TEMP/published-puttvision.apk"
          curl --fail-with-body -sSL --retry 3 --retry-all-errors "$CONSUMER_URL" -o "$PUBLISHED_CONSUMER"
          curl --fail-with-body -sSL --retry 3 --retry-all-errors "$DEVELOPER_URL" -o "$PUBLISHED_DEVELOPER"
          EXPECTED_DEVELOPER_SHA=$(cut -d' ' -f1 puttvision.apk.sha256)
          test "$(sha256sum "$PUBLISHED_CONSUMER" | cut -d' ' -f1)" = "$PV_RELEASE_SHA"
          test "$(sha256sum "$PUBLISHED_DEVELOPER" | cut -d' ' -f1)" = "$EXPECTED_DEVELOPER_SHA"
          test "$(stat -c%s "$PUBLISHED_CONSUMER")" = "$PV_APK_SIZE"
          test "$(stat -c%s "$PUBLISHED_DEVELOPER")" = "$(stat -c%s puttvision.apk)"

      - name: Publish and verify public updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        run: |
          set -euo pipefail
          jq -nc \
            --arg action external-finalize \
            --argjson vc "$PV_VERSION_CODE" \
            --arg vn "$PV_VERSION_NAME" \
            --arg sha "$PV_RELEASE_SHA" \
            --argjson size "$PV_APK_SIZE" \
            --arg apkUrl "$PV_APK_URL" \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size,apkUrl:$apkUrl}' > payload.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" -H 'content-type: application/json' -H "x-github-token: $GH_TOKEN" --data-binary @payload.json > finalize.json
          jq -e '.ok == true and .action == "external-finalize"' finalize.json >/dev/null
          PV_MANIFEST_URL=$(jq -r .manifestUrl finalize.json)
          [[ "$PV_MANIFEST_URL" == https://* ]]
          for i in 1 2 3 4 5 6 7 8; do
            LIVE=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$PV_MANIFEST_URL?cb=${GITHUB_RUN_ID}-${i}")
            if echo "$LIVE" | jq -e --argjson vc "$PV_VERSION_CODE" --arg vn "$PV_VERSION_NAME" --arg sha "$PV_RELEASE_SHA" --argjson size "$PV_APK_SIZE" --arg url "$PV_APK_URL" '.versionCode == $vc and .versionName == $vn and .sha256 == $sha and ((has("sizeBytes") | not) or .sizeBytes == $size) and .apkUrl == $url' >/dev/null; then
              echo "$LIVE" | jq .
              exit 0
            fi
            sleep 2
          done
          echo "Updater manifest did not converge to the new release" >&2
          exit 1

      - name: Report semantic release result
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          BODY="Current main release: **${JOB_STATUS}** · PuttVision ${PV_VERSION_NAME:-unknown} · run ${GITHUB_RUN_ID}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/138/comments" -f body="$BODY" >/dev/null
