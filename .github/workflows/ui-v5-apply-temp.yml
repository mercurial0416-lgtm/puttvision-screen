name: Apply commercial UI V5 temp

on:
  push:
    branches: [ commercial-ui-v5 ]
    paths: [ '.github/workflows/ui-v5-apply-temp.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # V5 verification retry after fixing the TV rail string type.
      - name: Apply V5 interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(src: str, start: str, nxt: str, replacement: str) -> str:
              a = src.index(start)
              b = src.index(nxt, a)
              return src[:a] + '    ' + replacement.rstrip() + '\n\n    ' + src[b:]

          main = Path('app/src/main/java/com/puttvision/screen/MainActivity.kt')
          s = main.read_text()
          s = replace_between(s, '    private fun buildUi() {', '    private fun buildSmartPuttMenu', Path('.ui-v5/buildUi.txt').read_text())
          s = replace_between(s, '    private fun buildVideoHomeScreen(): View {', '    private fun sectionPanel', Path('.ui-v5/home.txt').read_text())
          s = replace_between(s, '    private fun buildPracticeEntrance(): View {', '    private fun buildPracticeGreenPicker', Path('.ui-v5/practice.txt').read_text())
          s = replace_between(s, '    private fun buildGameEntrance(): View {', '    private fun showCupGuideScreen', Path('.ui-v5/game.txt').read_text())
          main.write_text(s)

          green = Path('app/src/main/java/com/puttvision/screen/GreenView.kt')
          g = green.read_text()
          g = replace_between(g, '    private fun drawAimReadout(c: Canvas, read: GreenRead) {', '    private fun drawBrandRail', Path('.ui-v5/tvReadout.txt').read_text())
          g = replace_between(g, '    private fun drawBrandRail(c: Canvas) {', '    private fun drawShotTelemetry', Path('.ui-v5/tvBrand.txt').read_text())
          g = replace_between(g, '    private fun drawShotTelemetry(c: Canvas) {', '    private fun drawResult', Path('.ui-v5/tvTelemetry.txt').read_text())
          a = g.index('    private fun drawResult(c: Canvas) {')
          g = g[:a] + '    ' + Path('.ui-v5/tvResult.txt').read_text().rstrip() + '\n}\n'
          green.write_text(g)
          PY

      - name: Compile verification
        run: gradle assembleDebug

      - name: Commit verified V5
        shell: bash
        run: |
          rm -rf .ui-v5
          rm -f .github/workflows/ui-v5-apply-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: commercial UI V5 with simplified product flow"
          git push origin HEAD:commercial-ui-v5
