name: Verify V27 pace and replay analysis

on:
  push:
    branches: [ agent/v27-hfr-annotation-line-speed-online-foundation ]

permissions:
  contents: write

concurrency:
  group: v27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire V27 systems
        shell: bash
        run: |
          python3 ci/v27_apply.py
          if ! git diff --quiet; then
            git diff --check
            git config user.name "puttvision-v27-bot"
            git config user.email "actions@users.noreply.github.com"
            git add FEATURE_MATRIX.json \
              app/src/main/java/com/puttvision/screen/MainActivity.kt \
              app/src/main/java/com/puttvision/screen/ProductSetupDialog.kt \
              app/src/main/java/com/puttvision/screen/V18OpenGlSimulator.kt \
              app/src/main/java/com/puttvision/screen/ImpactReplayView.kt \
              app/src/main/java/com/puttvision/screen/V27PaceLineOverlay.kt \
              app/src/test/java/com/puttvision/screen/V27FrameAnnotationBookTest.kt \
              app/src/test/java/com/puttvision/screen/V27CupPaceTest.kt
            git commit -m "feat: wire V27 pace line and frame annotations"
            git push
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit and regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile consumer and developer APKs
        run: gradle assembleConsumerDebug assembleDeveloperDebug
