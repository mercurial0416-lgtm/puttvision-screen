name: V152 manifest repair

on:
  push:
    branches: [main]
    paths:
      - .release-v152-manifest-repair
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Republish existing V152 manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
          MANIFEST_URL: https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update-v2.json
        shell: bash
        run: |
          set -euo pipefail
          VC=100191
          VN=0.7.191
          SHA=be8870c8ae7dc95c09a08faa10533f038baa54637efc072a6cd8031270857534
          SIZE=110192171
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/pv-$VC/puttvision-consumer.apk"
          jq -nc --arg action external-finalize --argjson vc "$VC" --arg vn "$VN" --arg sha "$SHA" --argjson size "$SIZE" --arg apkUrl "$APK_URL" '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size,apkUrl:$apkUrl}' > payload.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" -H 'content-type: application/json' -H "x-github-token: $GH_TOKEN" --data-binary @payload.json | tee finalize.json
          jq -e '.ok == true and .action == "external-finalize" and .versionCode == 100191' finalize.json >/dev/null
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl --fail-with-body -sS "$MANIFEST_URL?cb=${GITHUB_RUN_ID}-${i}")
            if echo "$LIVE" | jq -e --argjson vc "$VC" --arg sha "$SHA" --arg url "$APK_URL" '.versionCode == $vc and .sha256 == $sha and .apkUrl == $url' >/dev/null; then
              echo "$LIVE" | jq .
              exit 0
            fi
            sleep 2
          done
          echo "Manifest did not converge" >&2
          exit 1
