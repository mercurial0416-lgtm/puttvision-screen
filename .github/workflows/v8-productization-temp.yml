name: Verify PuttVision V8 productization temp

on:
  push:
    branches: [ productization-v8 ]
    paths:
      - '.v8/**'
      - '.github/workflows/v8-productization-temp.yml'

permissions:
  contents: write

concurrency:
  group: puttvision-v8-productization
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productization-v8
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply V8 productization integration
        run: python3 .v8/apply_productization.py

      - name: Compile verification
        run: gradle assembleDebug

      - name: Commit verified V8 productization
        shell: bash
        run: |
          rm -rf .v8
          rm -f .github/workflows/v8-productization-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit'
          else
            git commit -m 'feat: complete sale-ready PuttVision V8 productization'
            git push origin HEAD:productization-v8
          fi
