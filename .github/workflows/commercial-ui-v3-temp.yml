name: Apply commercial UI v3 temp

on:
  push:
    branches: [ commercial-ui-v3-immersive-terrain ]
    paths: [ '.github/workflows/commercial-ui-v3-temp.yml' ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply premium UI and terrain integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/puttvision/screen/MainActivity.kt')
          s = p.read_text()

          def replace_between(src, start_marker, next_marker, replacement):
              a = src.index(start_marker)
              b = src.index(next_marker, a)
              return src[:a] + replacement.rstrip() + '\n\n    ' + src[b:]

          if 'import androidx.core.view.WindowCompat' not in s:
              s = s.replace(
                  'import androidx.core.content.ContextCompat\n',
                  'import androidx.core.content.ContextCompat\nimport androidx.core.view.WindowCompat\nimport androidx.core.view.WindowInsetsCompat\nimport androidx.core.view.WindowInsetsControllerCompat\n'
              )
          s = s.replace(
              '        super.onCreate(savedInstanceState)\n        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)',
              '        super.onCreate(savedInstanceState)\n        applyImmersiveMode()\n        window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)'
          )
          s = s.replace(
              '    override fun onResume() {\n        super.onResume()\n',
              '    override fun onResume() {\n        super.onResume()\n        applyImmersiveMode()\n'
          )
          if 'private fun applyImmersiveMode()' not in s:
              immersive = Path('.ui-v3/immersive.txt').read_text()
              s = s.replace('    private fun probeHfr() {', immersive + '    private fun probeHfr() {')

          s = s.replace('PracticeGreenPreset("오르막 스트레이트", "1.2m / 45in", 0.0, 2.2, 3)', 'PracticeGreenPreset("오르막 스트레이트", "1.2m / 45in", 0.0, -2.2, 3)')
          s = s.replace('PracticeGreenPreset("오르막 브레이크", "1.2m / 45in", 2.8, 1.1, 4)', 'PracticeGreenPreset("오르막 브레이크", "1.2m / 45in", 2.8, -1.1, 4)')

          s = replace_between(s, 'private fun buildUi() {', 'private fun buildSmartPuttMenu', Path('.ui-v3/buildUi.txt').read_text())
          s = replace_between(s, 'private fun buildVideoHomeScreen(): View {', 'private fun sectionPanel', Path('.ui-v3/home.txt').read_text())
          s = replace_between(s, 'private fun buildEntranceHeader', 'private fun showPracticeEntrance', Path('.ui-v3/header.txt').read_text())

          s = s.replace(
              '        engine.settings.stimpMeters = practiceGreenSpeed\n        engine.gameModes.configurePlayers(if (game) gamePlayers else 1)',
              '        engine.settings.stimpMeters = practiceGreenSpeed\n        engine.settings.terrainProfileId = if (!game && practiceEntranceMode == 2) practiceGreenPresets[practiceGreenPresetIndex].previewStyle else -1\n        engine.gameModes.configurePlayers(if (game) gamePlayers else 1)'
          )
          s = s.replace(
              '            0 -> {\n                engine.settings.sideSlopePct = 0.0',
              '            0 -> {\n                engine.settings.terrainProfileId = -1\n                engine.settings.sideSlopePct = 0.0'
          )
          s = s.replace(
              '            1 -> {\n                engine.settings.holeDistanceM = base',
              '            1 -> {\n                engine.settings.terrainProfileId = -1\n                engine.settings.holeDistanceM = base'
          )
          s = s.replace(
              '            else -> {\n                val preset = practiceGreenPresets[practiceGreenPresetIndex]\n                engine.settings.holeDistanceM = when (practicePatternIndex) {',
              '            else -> {\n                val preset = practiceGreenPresets[practiceGreenPresetIndex]\n                engine.settings.terrainProfileId = preset.previewStyle\n                engine.settings.holeDistanceM = when (practicePatternIndex) {'
          )

          p.write_text(s)

          ui = Path('app/src/main/java/com/puttvision/screen/CommercialUiViews.kt')
          u = ui.read_text()
          class_pos = u.index('class CommercialModeVisualView')
          text_start = u.find('        p.typeface = Typeface.DEFAULT_BOLD', class_pos)
          text_end_marker = '        c.drawText(if (game) "1–4 PLAYER · COURSE · CHALLENGE" else "DISTANCE · CUP · BREAK · REPEAT", w * .10f, h * .31f, p)\n'
          text_end = u.find(text_end_marker, text_start)
          if text_start >= 0 and text_end >= 0:
              u = u[:text_start] + u[text_end + len(text_end_marker):]
          ui.write_text(u)
          PY

      - name: Compile verification
        run: gradle assembleDebug

      - name: Commit verified commercial v3
        shell: bash
        run: |
          rm -rf .ui-v3
          rm -f .github/workflows/commercial-ui-v3-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: immersive commercial UI v3 with spatial practice greens"
          git push origin HEAD:commercial-ui-v3-immersive-terrain
