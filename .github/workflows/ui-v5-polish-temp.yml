name: Polish commercial UI V5 temp

on:
  push:
    branches: [ commercial-ui-v5 ]
    paths: [ '.github/workflows/ui-v5-polish-temp.yml' ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Polish live runtime UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/puttvision/screen/MainActivity.kt')
          s = p.read_text()

          replacements = {
              'set("ball", m.ballSpeedMps?.let { "%.2f m/s".format(it) } ?: "--")': 'set("ball", m.ballSpeedMps?.let { "%.2f".format(it) } ?: "--")',
              'set("launch", "%+.2f°".format(m.launchAngleDeg))': 'set("launch", "%+.2f".format(m.launchAngleDeg))',
              'set("head", m.headSpeedMps?.let { "%.2f m/s".format(it) } ?: "--")': 'set("head", m.headSpeedMps?.let { "%.2f".format(it) } ?: "--")',
              'controls.addView(pvButton("분석", PvButtonStyle.GHOST, textSp = if (compact) 6.2f else 7.2f, radiusDp = Pv.rLg) { showStats(resumeAfter = sessionActive) }, LinearLayout.LayoutParams(0, -1, .66f).apply { marginStart = pvDp(5) })': 'controls.addView(pvButton("분석", PvButtonStyle.GHOST, textSp = if (compact) 6.2f else 7.2f, radiusDp = Pv.rLg) {\n        val resume = sessionActive\n        if (resume) suspendMeasurementForOverlay()\n        showStats(resumeAfter = resume)\n    }, LinearLayout.LayoutParams(0, -1, .66f).apply { marginStart = pvDp(5) })',
              'modeButton.text = engine.gameModes.status.mode.label': 'modeButton.text = "메뉴"',
              '"● ${fps}fps AUTO READY · 퍼팅하셈"': '"● ${fps}fps READY · 퍼팅하세요"',
              '"공/퍼터 자동감지 · 임팩트 후 자동 종료/분석"': '"공과 퍼터를 감지했습니다 · 퍼팅하세요"',
              '"HFR ${fps}fps 정밀분석"': '"샷 분석 중"',
              '"임팩트/템포/매트마찰/리플레이 계산중..."': '"임팩트와 스트로크를 분석하고 있습니다"',
              '"HFR 분석 실패 · QR/공/헤드마커 확인"': '"분석 실패 · 카메라 정렬을 확인하세요"',
              '"영상에 QR4개 + 흰 공 + 주황/파랑 헤드마커가 보여야 함."': '"마커와 공, 퍼터가 화면 안에 모두 보이는지 확인하세요."'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing polish target: {old[:80]}')
              s = s.replace(old, new, 1)

          anchor = '        overlay.status =\n            "$source · TV SHOT"\n\n'
          a = s.index(anchor) + len(anchor)
          b = s.index('\n\n        overlay.invalidate()', a)
          status_block = '''        metricText.text =
            buildString {
                append("샷 측정 완료")
                preScore?.let { append(" · SCORE ${it.total}") }
                coach?.let { append(" · ${it.headline}") }
            }'''
          s = s[:a] + status_block + s[b:]
          p.write_text(s)
          PY

      - name: Compile verification
        run: gradle assembleDebug

      - name: Commit verified V5 polish
        shell: bash
        run: |
          rm -f .github/workflows/ui-v5-polish-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish V5 live UX and measurement states"
          git push origin HEAD:commercial-ui-v5
