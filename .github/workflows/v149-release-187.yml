name: V149 release 0.7.187

on:
  pull_request:
    paths:
      - 'app/**'
      - 'ci/v143_fetch_cc0_assets.py'
      - '.github/workflows/v149-release-187.yml'

permissions:
  contents: write

concurrency:
  group: v149-release-187
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.head_ref == 'hotfix/v149-godot-47-stable-187' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v149-godot-47-stable-187
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify V149 engine rollback and three-stage diagnostic
        shell: bash
        run: |
          set -euo pipefail
          BUILD=app/build.gradle.kts
          MANIFEST=app/src/main/AndroidManifest.xml
          COORD=app/src/main/java/com/puttvision/screen/V148GodotDiagnostics.kt
          FULL=app/src/main/java/com/puttvision/screen/V144HardwarelessGodotActivity.kt
          EMPTY=app/src/main/assets/v149_empty.tscn
          grep -q 'org.godotengine:godot:4.7.0.stable' "$BUILD"
          ! grep -q 'org.godotengine:godot:4.7.1.stable' "$BUILD"
          test -s "$EMPTY"
          grep -q 'class V149GodotProbeActivity : GodotActivity' "$COORD"
          grep -q 'class V148GodotSmokeActivity : V149GodotProbeActivity' "$COORD"
          grep -q 'class V149GodotSceneSmokeActivity : V149GodotProbeActivity' "$COORD"
          grep -q 'res://v149_empty.tscn' "$COORD"
          grep -q 'getCommandLine' "$COORD"
          grep -q 'class V148HardwarelessFullActivity : GodotActivity' "$FULL"
          grep -q 'android:process=":godot_smoke"' "$MANIFEST"
          grep -q 'android:process=":godot_scene"' "$MANIFEST"
          grep -q 'android:process=":hardwareless_full"' "$MANIFEST"
          grep -q 'getHistoricalProcessExitReasons' "$COORD"
          grep -q 'out.fd.sync()' "$COORD"
          grep -q 'NATIVE_CRASH' "$COORD"

      - name: Fetch V143 Godot visual assets
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/v143_fetch_cc0_assets.py
          test -s app/src/main/assets/v143_assets/turf/albedo.png
          test -s app/src/main/assets/v143_assets/turf/normal.png
          test -s app/src/main/assets/v143_assets/turf/roughness.png
          test -s app/src/main/assets/v143_assets/trees/tree_small_02.png
          test -s app/src/main/assets/v143_assets/trees/island_tree_03.png
          test -s app/src/main/assets/v143_assets/environment/environment.hdr

      - name: Test and build 0.7.187
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
          PV_VERSION_CODE: '100187'
          PV_VERSION_NAME: '0.7.187'
        shell: bash
        run: |
          set -euo pipefail
          gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
          gradle assembleConsumerRelease
          APK=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Verify Godot 4.7.0 native runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v149-native"
          mkdir -p "$OUT"
          GODOT_AAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.godotengine/godot/4.7.0.stable" -type f -name '*.aar' | head -1)
          test -s "$GODOT_AAR"
          ENTRY=$(unzip -Z1 "$GODOT_AAR" | grep 'arm64-v8a/libc++_shared.so$' | head -1)
          unzip -p "$GODOT_AAR" "$ENTRY" > "$OUT/godot-libc++.so"
          unzip -p "$UNSIGNED_APK" lib/arm64-v8a/libc++_shared.so > "$OUT/apk-libc++.so"
          test "$(sha256sum "$OUT/godot-libc++.so" | cut -d' ' -f1)" = "$(sha256sum "$OUT/apk-libc++.so" | cut -d' ' -f1)"
          unzip -l "$UNSIGNED_APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          ZIPALIGN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 4 "$UNSIGNED_APK"

      - name: Restore release signing lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/signing-v3.tgz"
          DIR="$RUNNER_TEMP/signing-v3"
          ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "puttvision-signing-vault-v3") | .assets[] | select(.name == "puttvision-signing-bundle-v3.tgz" or .label == "puttvision-signing-bundle.tgz") | .id' | head -1)
          test -n "$ASSET_ID"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$BUNDLE"
          mkdir -p "$DIR"
          tar -xzf "$BUNDLE" -C "$DIR"
          test -s "$DIR/release.jks"
          test -s "$DIR/signing-lineage"
          set -a; source "$DIR/signing.env"; set +a
          test "$ROTATION_MIN_SDK" = 28
          CERT=$(keytool -exportcert -keystore "$DIR/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          test "$CERT" = '7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb'
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          chmod 600 "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
          echo "PV_SIGNING_DIR=$DIR" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PV_ROTATION_MIN_SDK=$ROTATION_MIN_SDK" >> "$GITHUB_ENV"

      - name: Sign and verify consumer APK
        shell: bash
        run: |
          set -euo pipefail
          A=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$A" sign \
            --ks "$PV_SIGNING_DIR/release.jks" \
            --ks-key-alias "$PV_KEY_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/store.pass" \
            --key-pass "file:$RUNNER_TEMP/key.pass" \
            --lineage "$PV_SIGNING_DIR/signing-lineage" \
            --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK" \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out puttvision-consumer.apk "$UNSIGNED_APK"
          "$A" verify --verbose --print-certs --min-sdk-version 28 puttvision-consumer.apk
          CERT=$("$A" verify --print-certs puttvision-consumer.apk 2>&1 | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]')
          test "$CERT" = '7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb'
          SIZE=$(stat -c%s puttvision-consumer.apk)
          test "$SIZE" -lt $((180 * 1024 * 1024))
          SHA=$(sha256sum puttvision-consumer.apk | cut -d' ' -f1)
          echo "$SHA  puttvision-consumer.apk" > puttvision-consumer.apk.sha256
          echo "PV_APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "PV_RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "PV_APK_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/pv-100187/puttvision-consumer.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='V149: rolls the embedded Godot Android runtime from 4.7.1.stable back to 4.7.0.stable after a real-device plugin-free SIGSEGV. SIM LAB now automatically isolates empty engine, production V143 scene, then full bridge/GameEngine in three separate crash-attributable processes.'
          if gh release view pv-100187 >/dev/null 2>&1; then
            gh release upload pv-100187 puttvision-consumer.apk puttvision-consumer.apk.sha256 --clobber
            gh release edit pv-100187 --title 'PuttVision 0.7.187' --notes "$NOTES" --latest
          else
            gh release create pv-100187 puttvision-consumer.apk puttvision-consumer.apk.sha256 \
              --target hotfix/v149-godot-47-stable-187 \
              --title 'PuttVision 0.7.187' \
              --notes "$NOTES" \
              --latest
          fi
          curl --fail-with-body -sSIL "$PV_APK_URL" >/dev/null

      - name: Publish and verify update-v2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        run: |
          set -euo pipefail
          jq -nc \
            --arg action external-finalize \
            --argjson vc 100187 \
            --arg vn '0.7.187' \
            --arg sha "$PV_RELEASE_SHA" \
            --argjson size "$PV_APK_SIZE" \
            --arg apkUrl "$PV_APK_URL" \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size,apkUrl:$apkUrl}' > publish.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" \
            -H 'content-type: application/json' \
            -H "x-github-token: $GH_TOKEN" \
            --data-binary @publish.json | tee publish-result.json
          jq -e '.ok == true and .versionCode == 100187 and .versionName == "0.7.187"' publish-result.json >/dev/null

          V2=https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update-v2.json
          ok=0
          for i in $(seq 1 24); do
            LIVE=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$V2?settle=$(date +%s%N)" || true)
            if echo "$LIVE" | jq -e --arg sha "$PV_RELEASE_SHA" --arg url "$PV_APK_URL" '.versionCode == 100187 and .versionName == "0.7.187" and .sha256 == $sha and .apkUrl == $url' >/dev/null 2>&1; then
              echo "$LIVE" | jq .
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
