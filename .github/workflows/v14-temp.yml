name: Verify PuttVision V14 temp

on:
  push:
    branches: [ v14-vision-and-tv-live ]
    paths:
      - '.github/workflows/v14-temp.yml'
      - '.v14/**'

permissions:
  contents: write

jobs:
  verify-v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v14-vision-and-tv-live
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V14 integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.v14/apply_v14.py')
          s=p.read_text()
          s=s.replace(
              'root.addView(pvButton("자동 시나리오 전체검사", PvButtonStyle.PRIMARY)',
              'controls.addView(pvButton("자동 시나리오 전체검사", PvButtonStyle.PRIMARY, textSp = 7f)'
          )
          s=s.replace(
              'root.addView(pvButton("SIM CAMERA 2.0',
              'controls.addView(pvButton("SIM CAMERA 2.0'
          )
          start=s.find('# ---------- GreenView live screen-putting presentation ----------')
          end=s.find('# ---------- TV replay becomes PiP, never hides live green ----------', start)
          if start < 0 or end < 0:
              raise SystemExit('V14 Green section not found')
          s=s[:start] + s[end:]
          p.write_text(s)
          PY
          python .v14/apply_v14.py
          python .v14/apply_v14_green_actual.py
      - name: Static V14 guards
        shell: bash
        run: |
          grep -q 'analyzeSynthetic' app/src/main/java/com/puttvision/screen/HfrVideoAnalyzer.kt
          grep -q 'V14RobustKinematics.fit' app/src/main/java/com/puttvision/screen/HfrVideoAnalyzer.kt
          grep -q 'TvInstantRollRuntime.begin' app/src/main/java/com/puttvision/screen/MainActivity.kt
          grep -q 'TvInstantRollRuntime.displayPosition' app/src/main/java/com/puttvision/screen/GreenView.kt
          grep -q 'LAB P95' app/src/main/java/com/puttvision/screen/V14VisionSystems.kt
          grep -q 'rollSpinRpm' app/src/main/java/com/puttvision/screen/StatsRepository.kt
          grep -q 'SIM CAMERA 2.0' app/src/main/java/com/puttvision/screen/MainActivity.kt
          git diff --check
      - name: Full regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V14 app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat: V14 vision accuracy and instant TV roll'
          git push origin HEAD:v14-vision-and-tv-live
