name: Verify PuttVision V9 final temp

on:
  push:
    branches: [ productization-v9 ]
    paths:
      - '.github/workflows/v9-final-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: productization-v9
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Distribution boundary audit
        shell: bash
        run: |
          test ! -f app/src/main/java/com/puttvision/screen/DeployActivity.kt
          ! grep -q 'DeployActivity' app/src/main/AndroidManifest.xml
          grep -q 'DeployActivity' app/src/developer/AndroidManifest.xml
      - name: Regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile consumer and developer
        run: gradle assembleConsumerDebug assembleDeveloperDebug
