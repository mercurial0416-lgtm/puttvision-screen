name: PuttVision 2 verify

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: puttvision2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify current-main release entrypoint contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/current-main-release.yml').read_text()
          marker = '$' + '{{'
          expected = (
              "if: " + marker + " github.event.issue.number == 138 && "
              "github.event.comment.body == '/release-current-main' && "
              "github.actor == github.repository_owner }}"
          )
          release_if_lines = [
              line.strip()
              for line in workflow.splitlines()
              if line.lstrip().startswith('if:')
          ]
          if release_if_lines.count(expected) != 1:
              raise SystemExit(
                  'current-main owner-only release trigger missing or duplicated: '
                  + repr(release_if_lines)
              )

          legacy_marker_patterns = ('.release-*', '.v*-*trigger*')
          stale_markers = sorted({
              str(path)
              for pattern in legacy_marker_patterns
              for path in Path('.').glob(pattern)
              if path.is_file()
          })
          if stale_markers:
              raise SystemExit(
                  'legacy release trigger markers are forbidden; use issue #138 '
                  '/release-current-main only: ' + repr(stale_markers)
              )
          PY

      - name: Install exact Gradle 8.13 toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -n "${ANDROID_HOME:-}"
          curl --fail --location --retry 5 --retry-delay 3 \
            https://downloads.gradle.org/distributions/gradle-8.13-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          echo "dccb1612e69e36aa7f52082be0d820a27f90c1c7c58c7ab4e9df2eed1f3f7f65  $RUNNER_TEMP/gradle-8.13-bin.zip" \
            | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version

      - name: Compile and run Android unit regression suites
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" \
            testConsumerDebugUnitTest \
            testDeveloperDebugUnitTest
