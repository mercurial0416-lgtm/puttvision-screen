name: PuttVision 2 verify

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: puttvision2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify current-main release entrypoint contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/current-main-release.yml').read_text()
          marker = '$' + '{{'
          expected = (
              "if: " + marker + " github.event.issue.number == 138 && "
              "github.event.comment.body == '/release-current-main' && "
              "github.actor == github.repository_owner }}"
          )
          release_if_lines = [
              line.strip()
              for line in workflow.splitlines()
              if line.lstrip().startswith('if:')
          ]
          if release_if_lines.count(expected) != 1:
              raise SystemExit(
                  'current-main owner-only release trigger missing or duplicated: '
                  + repr(release_if_lines)
              )

          # Production releases must be serialized. Two overlapping issue-comment
          # dispatches can otherwise allocate the same next tag or race public
          # updater publication even though each individual run is valid.
          required_concurrency_fragments = (
              'concurrency:',
              'group: puttvision-current-main-release',
              'cancel-in-progress: false',
          )
          missing_concurrency_fragments = [
              fragment
              for fragment in required_concurrency_fragments
              if workflow.count(fragment) != 1
          ]
          if missing_concurrency_fragments:
              raise SystemExit(
                  'current-main release serialization guard missing or duplicated: '
                  + repr(missing_concurrency_fragments)
              )

          # The stale-release cleanup must stay strictly before public updater
          # publication. Deleting a release after publishing its APK URL would
          # leave installed clients with a manifest that points at a dead asset.
          ordered_steps = (
              '- name: Remove unpublished stale release on pre-updater failure',
              '- name: Publish and verify public updater manifest',
              '- name: Verify latest release and updater contract',
          )
          positions = []
          for step in ordered_steps:
              count = workflow.count(step)
              if count != 1:
                  raise SystemExit(
                      f'current-main release safety step missing or duplicated: '
                      f'{step!r} count={count}'
                  )
              positions.append(workflow.index(step))
          if positions != sorted(positions):
              raise SystemExit(
                  'unsafe current-main release step order; stale cleanup must '
                  'precede updater publication, which must precede final contract '
                  f'verification: {positions!r}'
              )

          cleanup_name = ordered_steps[0]
          cleanup_start = workflow.index(cleanup_name)
          publish_start = workflow.index(ordered_steps[1])
          cleanup_block = workflow[cleanup_start:publish_start]
          cleanup_guard = (
              "if: " + marker
              + " failure() && env.PV_RELEASE_ATTEMPTED == 'true' }}"
          )
          if cleanup_guard not in cleanup_block:
              raise SystemExit(
                  'pre-updater stale-release cleanup lost its failure-only guard'
              )

          release_publish_name = '- name: Publish semantic GitHub release'
          integrity_name = '- name: Verify published APK integrity'
          release_publish_start = workflow.index(release_publish_name)
          integrity_start = workflow.index(integrity_name)
          release_publish_block = workflow[release_publish_start:integrity_start]
          required_probe_fragments = (
              'curl --fail-with-body -sSIL',
              '--retry 5',
              '--retry-all-errors',
              '--retry-delay 2',
              '--connect-timeout 15',
              '--max-time 120',
          )
          missing_probe_fragments = [
              fragment
              for fragment in required_probe_fragments
              if fragment not in release_publish_block
          ]
          if missing_probe_fragments:
              raise SystemExit(
                  'published APK availability probe lost retry/timeout safety: '
                  + repr(missing_probe_fragments)
              )

          legacy_marker_patterns = ('.release-*', '.v*-*trigger*')
          stale_markers = sorted({
              str(path)
              for pattern in legacy_marker_patterns
              for path in Path('.').glob(pattern)
              if path.is_file()
          })
          if stale_markers:
              raise SystemExit(
                  'legacy release trigger markers are forbidden; use issue #138 '
                  '/release-current-main only: ' + repr(stale_markers)
              )
          PY

      - name: Install exact Gradle 8.13 toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -n "${ANDROID_HOME:-}"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 300 \
            https://downloads.gradle.org/distributions/gradle-8.13-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle-8.13-bin.zip" \
            | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version

      - name: Compile, package, and run Android unit regression suites
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" \
            testConsumerDebugUnitTest \
            testDeveloperDebugUnitTest \
            assembleConsumerDebug \
            assembleDeveloperDebug
