name: Verify PuttVision V10 temp

on:
  push:
    branches: [ v10-actual ]
    paths:
      - '.v10/**'
      - '.github/workflows/v10-verify-temp.yml'

permissions:
  contents: write

concurrency:
  group: puttvision-v10-temp
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-actual
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V10 patch
        run: python .v10/apply_v10.py
      - name: V10 patch fixups
        run: sed -i 's/snap.playerScores/snap.scores/' app/src/test/java/com/puttvision/screen/GameModeRecoveryRegressionTest.kt
      - name: Diff sanity
        run: git diff --check
      - name: Unit regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V10 app code
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if git diff --cached --quiet; then
            echo 'No app changes to commit'
          else
            git commit -m 'feat: V10 adaptive precision recovery and physics green read'
            git push origin HEAD:v10-actual
          fi
