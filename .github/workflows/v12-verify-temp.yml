name: Verify PuttVision V12 temp

on:
  push:
    branches: [ v12-unified-surface ]
    paths:
      - '.github/workflows/v12-verify-temp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-unified-surface
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply V12 patch
        run: python .v12/apply_v12.py
      - name: Diff sanity
        run: git diff --check
      - name: Regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile both channels
        run: gradle assembleConsumerDebug assembleDeveloperDebug
      - name: Commit verified V12 app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          test -n "$(git status --porcelain app)"
          git commit -m 'feat: V12 unified surface and adaptive runtime'
          git pull --rebase origin v12-unified-surface
          git push origin HEAD:v12-unified-surface
