name: Deploy Dugout Duel to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dugout-duel-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dugout-duel-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game branch
        uses: actions/checkout@v4
        with:
          ref: feature/dugout-duel-multiplayer

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Dugout Duel
        uses: actions/upload-pages-artifact@v3
        with:
          path: dugout-duel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
