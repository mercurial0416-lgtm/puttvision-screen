name: Clean reference UI temp

on:
  push:
    branches: [ reference-ui-rebuild ]
    paths: [ '.github/workflows/reference-ui-clean-temp.yml' ]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Remove generated files and verify
        shell: bash
        run: |
          git rm -r --ignore-unmatch .gradle app/build
          cat > .gitignore <<'EOF'
          .gradle/
          **/build/
          local.properties
          *.iml
          .idea/
          EOF
          gradle assembleDebug
          rm -f .github/workflows/reference-ui-clean-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git ls-files | grep -E '(^\.gradle/|/build/)' ; then
            echo 'Generated artifacts still tracked' >&2
            exit 1
          fi
          git commit -m "chore: ignore generated Android build artifacts"
          git push origin HEAD:reference-ui-rebuild
