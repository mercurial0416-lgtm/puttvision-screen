name: V142 render repair patch

on:
  push:
    branches: [ agent/v142-playable-render-fix ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v142-patcher]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v142-playable-render-fix
          fetch-depth: 0

      - name: Apply V142 playability repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scenery = Path('app/src/main/java/com/puttvision/screen/V141SceneryAssets.kt')
          s = scenery.read_text()
          old = '''                material.baseColor = vec4(tex.rgb * materialParams.tint, tex.a);\n                material.roughness = 0.92;\n                material.reflectance = 0.10;'''
          new = '''                // V142: billboard foliage is presentation scenery. Lighting a single flat normal\n                // with the course sun turned the entire alpha card nearly black on real devices.\n                // Keep sampled color and alpha unlit; the 3D course still carries physical light.\n                material.baseColor = vec4(tex.rgb * materialParams.tint, tex.a);'''
          assert old in s, 'tree material body changed'
          s = s.replace(old, new, 1)
          old = '.name("PV141 Tree Billboard")\n            .shading(MaterialBuilder.Shading.LIT)'
          new = '.name("PV142 Color-Stable Tree Billboard")\n            .shading(MaterialBuilder.Shading.UNLIT)'
          assert old in s, 'tree shading declaration changed'
          s = s.replace(old, new, 1)
          assert '.maskThreshold(.30f)' in s
          s = s.replace('.maskThreshold(.30f)', '.maskThreshold(.18f)', 1)
          s = s.replace('            .transparentShadow(true)\n', '', 1)
          scenery.write_text(s)

          renderer = Path('app/src/main/java/com/puttvision/screen/V141FriendsPbrScreenGolf.kt')
          r = renderer.read_text()

          replacements = {
              'turfInstance(.76f, .96f, .72f, 1.25f, .72f)': 'turfInstance(.82f, .90f, .78f, 1.10f, .48f)',
              'turfInstance(.92f, 1.02f, .83f, 2.20f, .88f)': 'turfInstance(.94f, .98f, .88f, 1.72f, .58f)',
              'turfInstance(1.04f, 1.08f, .91f, 3.05f, 1.04f)': 'turfInstance(.99f, 1.00f, .92f, 2.18f, .66f)',
          }
          for old, new in replacements.items():
              assert old in r, f'missing turf preset {old}'
              r = r.replace(old, new, 1)

          horizon_pattern = re.compile(
              r'    private fun addHorizonTrees\(settings: GreenSettings, d: Double, tier: V24RenderTier\) \{.*?\n    \}\n\n    private fun addClubhouseAndFence',
              re.S,
          )
          horizon_new = '''    private fun addHorizonTrees(settings: GreenSettings, d: Double, tier: V24RenderTier) {
        val maps = requireNotNull(sceneryMaps)
        // V142: sparse, smaller cards behind the clubhouse keep the cup silhouette readable.
        val count = when (tier) {
            V24RenderTier.HIGH -> 8
            V24RenderTier.BALANCED -> 7
            V24RenderTier.PERFORMANCE -> 6
        }
        for (i in 0 until count) {
            val t = if (count <= 1) .5f else i.toFloat() / (count - 1)
            val x = -10.8f + 21.6f * t
            val y = (d + 10.4 + (i % 3) * 1.05).toFloat()
            val ground = V141Geometry.groundHeight(settings, d, x.toDouble(), y.toDouble())
            val width = 2.20f + (i % 3) * .30f
            val height = 3.45f + (i % 4) * .32f
            val autumn = i == count - 3
            val mi = V141SceneryAssets.treeInstance(
                treeMaterial, maps, x, ground, width, height,
                if (autumn) 1.12f else 1.00f,
                if (autumn) .72f else 1.00f,
                if (autumn) .58f else .96f
            ).also { materialInstances += it }
            sceneMeshes += createRenderable(
                V141Geometry.verticalQuad(x, y, ground, width, height),
                mi, castShadow = false, contactShadow = false
            )
        }
    }

    private fun addClubhouseAndFence'''
          r2, n = horizon_pattern.subn(horizon_new, r, count=1)
          assert n == 1, f'horizon function replacement count={n}'
          r = r2

          cup_pattern = re.compile(
              r'    private fun addCup\(settings: GreenSettings, d: Double\) \{.*?\n    \}\n\n    private fun updateCameraAndBall',
              re.S,
          )
          cup_new = '''    private fun addCup(settings: GreenSettings, d: Double) {
        val surfaceZ = GreenTerrain.effectiveHeightAt(settings, 0.0, d).toFloat() + .020f
        val depth = V135RigidBallPhysics.CUP_DEPTH_M.toFloat()

        sceneMeshes += createRenderable(
            V141Geometry.disc(0f, d.toFloat(), surfaceZ - .006f, .050f, 64),
            litInstance(litMaterial, .004f, .006f, .004f), false, false
        )
        sceneMeshes += createRenderable(
            V141Geometry.cupWall(0f, d.toFloat(), surfaceZ - .001f, .054f, depth, 64),
            litInstance(litMaterial, .91f, .92f, .89f), false, true
        )
        sceneMeshes += createRenderable(
            V141Geometry.disc(0f, d.toFloat(), surfaceZ - depth + .002f, .052f, 64),
            litInstance(litMaterial, .008f, .010f, .008f), false, false
        )
        sceneMeshes += createRenderable(
            V141Geometry.ring(0f, d.toFloat(), surfaceZ - .003f, .047f, .054f, 64),
            litInstance(litMaterial, .90f, .91f, .88f), false, false
        )

        // Presentation pin stays visible even when the physical flagstick is OUT.
        if (V142RenderContract.showTargetPin()) {
            val visualRadius = if (settings.flagstickIn) .0065f else .0046f
            sceneMeshes += createRenderable(
                V141Geometry.cylinder(0f, d.toFloat(), surfaceZ + .002f, visualRadius, 1.92f, 18),
                litInstance(litMaterial, .96f, .97f, .94f), false, true
            )
            sceneMeshes += createRenderable(
                V141Geometry.flag(0f, d.toFloat(), surfaceZ + 1.79f),
                litInstance(litMaterial, .86f, .025f, .020f), false, false
            )
        }
    }

    private fun updateCameraAndBall'''
          r2, n = cup_pattern.subn(cup_new, r, count=1)
          assert n == 1, f'cup function replacement count={n}'
          r = r2

          old = '''        val start = V26BallStartRuntime.current(settings)\n        val display = TvInstantRollRuntime.displayPosition(state)\n        val bx = display?.first ?: state?.x ?: start.first\n        val by = display?.second ?: state?.y ?: start.second'''
          new = '''        val start = V26BallStartRuntime.current(settings)\n        // V142: the instant-roll handoff is only a pre-simulation snapshot. Render physics state.\n        val authoritative = V142RenderContract.authoritativeBallPosition(\n            state?.x, state?.y, start.first, start.second\n        )\n        val bx = authoritative.first\n        val by = authoritative.second'''
          assert old in r, 'authoritative ball patch target changed'
          r = r.replace(old, new, 1)

          old = '                if (!fringe && hypot(xm, ym - d) < .072) continue'
          new = '                if (hypot(xm, ym - d) < if (fringe) .068 else .072) continue'
          assert old in r, 'green cup-cutout target changed'
          r = r.replace(old, new, 1)
          renderer.write_text(r)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/puttvision/screen/V141SceneryAssets.kt \
                  app/src/main/java/com/puttvision/screen/V141FriendsPbrScreenGolf.kt
          if git diff --cached --quiet; then
            echo "No V142 patch changes required"
            exit 0
          fi
          git commit -m "V142: repair scenery, cup visibility and ball motion [v142-patcher]"
          git push origin HEAD:agent/v142-playable-render-fix
