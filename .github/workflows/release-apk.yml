name: Build and publish PuttVision APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: puttvision-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Allocate monotonic app version
        shell: bash
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.7.${GITHUB_RUN_NUMBER}"
          echo "PV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PV_TAG=pv-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Real-device measurement regression gate
        shell: bash
        run: |
          set -euo pipefail
          REF=validation/v20_reference.csv
          MEASURED=validation/v20_measured.csv
          if [ -f "$REF" ] && [ -f "$MEASURED" ]; then
            echo "Running BALL / START / FACE / PATH real-device accuracy gate"
            python3 ci/v20_accuracy_gate.py "$REF" "$MEASURED"
          elif [ -f "$REF" ] || [ -f "$MEASURED" ]; then
            echo "Accuracy fixture set is incomplete; both $REF and $MEASURED are required" >&2
            exit 1
          else
            echo "No real-device reference dataset committed yet; release accuracy gate is armed but inactive."
          fi

      - name: Restore or bootstrap release signing bundle
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.PUTTVISION_SIGNING_BUNDLE_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE_FILE="$RUNNER_TEMP/puttvision-signing-bundle.tgz"
          VAULT_TAG="puttvision-signing-vault-v2"
          VAULT_ASSET="puttvision-signing-bundle.tgz"
          SIGNING_DIR="$RUNNER_TEMP/puttvision-signing"
          mkdir -p "$SIGNING_DIR"

          if [ -n "$SIGNING_BUNDLE_B64" ]; then
            printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$BUNDLE_FILE"
            echo "Restored release signing bundle from Actions secret."
          else
            ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == true and (.tag_name == "puttvision-signing-vault-v1" or .tag_name == "puttvision-signing-vault-v2")) | .assets[] | select(.name == "puttvision-signing-bundle.tgz") | .id' | head -1)
            if [ -n "$ASSET_ID" ]; then
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$BUNDLE_FILE"
              echo "Restored release signing bundle from private draft escrow."
            else
              echo "No signing backup exists; bootstrapping a persistent replacement release key."
              STORE_PASSWORD=$(openssl rand -hex 32)
              KEY_PASSWORD="$STORE_PASSWORD"
              KEY_ALIAS="puttvision-release"
              ROTATION_MIN_SDK=28
              keytool -genkeypair \
                -keystore "$SIGNING_DIR/release.jks" \
                -storetype JKS \
                -storepass "$STORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                -alias "$KEY_ALIAS" \
                -keyalg RSA \
                -keysize 4096 \
                -validity 36500 \
                -dname "CN=PuttVision Release,O=PuttVision,C=KR" \
                -noprompt
              cat > "$SIGNING_DIR/signing.env" <<EOF
          STORE_PASSWORD=$STORE_PASSWORD
          KEY_PASSWORD=$KEY_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          ROTATION_MIN_SDK=$ROTATION_MIN_SDK
          EOF
              chmod 600 "$SIGNING_DIR/release.jks" "$SIGNING_DIR/signing.env"
              tar -czf "$BUNDLE_FILE" -C "$SIGNING_DIR" release.jks signing.env
            fi
          fi

          test -s "$BUNDLE_FILE"
          rm -rf "$SIGNING_DIR"
          mkdir -p "$SIGNING_DIR"
          tar -xzf "$BUNDLE_FILE" -C "$SIGNING_DIR"
          test -s "$SIGNING_DIR/release.jks"
          test -s "$SIGNING_DIR/signing.env"
          chmod 600 "$SIGNING_DIR/release.jks" "$SIGNING_DIR/signing.env"
          if [ -s "$SIGNING_DIR/signing-lineage" ]; then
            chmod 600 "$SIGNING_DIR/signing-lineage"
            echo "PV_HAS_LINEAGE=true" >> "$GITHUB_ENV"
          else
            echo "PV_HAS_LINEAGE=false" >> "$GITHUB_ENV"
          fi

          set -a
          source "$SIGNING_DIR/signing.env"
          set +a
          for name in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS ROTATION_MIN_SDK; do
            if [ -z "${!name:-}" ]; then
              echo "Signing bundle is missing $name" >&2
              exit 1
            fi
          done
          keytool -list -keystore "$SIGNING_DIR/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          # Re-escrow every successfully restored/generated bundle so future releases do not depend on one source.
          if gh release view "$VAULT_TAG" >/dev/null 2>&1; then
            gh release upload "$VAULT_TAG" "$BUNDLE_FILE#$VAULT_ASSET" --clobber
          else
            gh release create "$VAULT_TAG" "$BUNDLE_FILE#$VAULT_ASSET" \
              --title "PuttVision signing vault v2" \
              --notes "Private draft escrow for the active Android release signing bundle. Do not publish." \
              --draft
          fi

          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/puttvision-store.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/puttvision-key.pass"
          chmod 600 "$RUNNER_TEMP/puttvision-store.pass" "$RUNNER_TEMP/puttvision-key.pass"
          echo "PV_SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PV_ROTATION_MIN_SDK=$ROTATION_MIN_SDK" >> "$GITHUB_ENV"

      - name: Build unsigned consumer and developer APKs
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
        run: gradle assembleConsumerRelease assembleDeveloperRelease

      - name: Sign release APKs and verify certificates
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner not available" >&2
            exit 1
          fi

          CONSUMER_UNSIGNED=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          DEVELOPER_UNSIGNED=$(find app/build/outputs/apk/developer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$CONSUMER_UNSIGNED"
          test -s "$DEVELOPER_UNSIGNED"

          sign_one() {
            local input="$1"
            local output="$2"
            local args=(
              --ks "$PV_SIGNING_DIR/release.jks"
              --ks-key-alias "$PV_KEY_ALIAS"
              --ks-pass "file:$RUNNER_TEMP/puttvision-store.pass"
              --key-pass "file:$RUNNER_TEMP/puttvision-key.pass"
              --v1-signing-enabled false
              --v4-signing-enabled false
            )
            if [ "$PV_HAS_LINEAGE" = "true" ]; then
              args+=(
                --lineage "$PV_SIGNING_DIR/signing-lineage"
                --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK"
                --v2-signing-enabled false
                --v3-signing-enabled true
              )
            else
              args+=(
                --v2-signing-enabled true
                --v3-signing-enabled true
              )
            fi
            "$APKSIGNER" sign "${args[@]}" --out "$output" "$input"
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 28 "$output"
          }

          sign_one "$CONSUMER_UNSIGNED" puttvision-consumer.apk
          sign_one "$DEVELOPER_UNSIGNED" puttvision.apk
          sha256sum puttvision.apk > puttvision.apk.sha256
          sha256sum puttvision-consumer.apk > puttvision-consumer.apk.sha256

          SHA=$(cut -d' ' -f1 puttvision-consumer.apk.sha256)
          SIZE=$(stat -c%s puttvision-consumer.apk)
          echo "PV_RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "PV_APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Request one-time Supabase upload token
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg action prepare \
            --argjson vc "$PV_VERSION_CODE" \
            --arg vn "$PV_VERSION_NAME" \
            --arg sha "$PV_RELEASE_SHA" \
            --argjson size "$PV_APK_SIZE" \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}')
          curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_URL" \
            -H 'content-type: application/json' \
            -H "x-github-token: $GH_TOKEN" \
            --data-binary "$PAYLOAD" > prepare.json
          jq -e '.ok == true and .action == "prepare"' prepare.json >/dev/null
          TOKEN=$(jq -r '.uploadToken' prepare.json)
          echo "::add-mask::$TOKEN"
          echo "PV_UPLOAD_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "PV_OBJECT_PATH=$(jq -r '.objectPath' prepare.json)" >> "$GITHUB_ENV"
          echo "PV_APK_URL=$(jq -r '.apkUrl' prepare.json)" >> "$GITHUB_ENV"
          echo "PV_MANIFEST_URL=$(jq -r '.manifestUrl' prepare.json)" >> "$GITHUB_ENV"

      - name: Upload consumer APK to public Supabase Storage
        env:
          SUPABASE_URL: https://razejagceyznnajioxgx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_fjgUBLTNcWG5-f8EDFpLyw_P5wXmmFS
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @supabase/supabase-js@2.57.4 >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const { createClient } = require('@supabase/supabase-js');
          (async () => {
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_PUBLISHABLE_KEY, {
              auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
            });
            const apk = fs.readFileSync('puttvision-consumer.apk');
            const { data, error } = await supabase.storage
              .from('puttvision-update')
              .uploadToSignedUrl(process.env.PV_OBJECT_PATH, process.env.PV_UPLOAD_TOKEN, apk, {
                contentType: 'application/vnd.android.package-archive',
                cacheControl: '31536000',
              });
            if (error) throw error;
            if (!data?.path) throw new Error('signed upload completed without object path');
            console.log(`Signed upload complete: ${data.path}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify public consumer APK SHA before release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location "$PV_APK_URL" -o uploaded-public.apk
          test "$(stat -c%s uploaded-public.apk)" -eq "$PV_APK_SIZE"
          echo "$PV_RELEASE_SHA  uploaded-public.apk" | sha256sum -c -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(puttvision.apk puttvision.apk.sha256 puttvision-consumer.apk puttvision-consumer.apk.sha256)
          if gh release view "$PV_TAG" >/dev/null 2>&1; then
            gh release upload "$PV_TAG" "${ASSETS[@]}" --clobber
            gh release edit "$PV_TAG" --title "PuttVision $PV_VERSION_NAME" --notes "PuttVision $PV_VERSION_NAME · verified consumer/developer release" --latest
          else
            gh release create "$PV_TAG" "${ASSETS[@]}" \
              --title "PuttVision $PV_VERSION_NAME" \
              --notes "PuttVision $PV_VERSION_NAME · verified consumer/developer release" \
              --latest
          fi

      - name: Publish verified Supabase update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg action finalize \
            --argjson vc "$PV_VERSION_CODE" \
            --arg vn "$PV_VERSION_NAME" \
            --arg sha "$PV_RELEASE_SHA" \
            --argjson size "$PV_APK_SIZE" \
            '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}')
          curl --fail-with-body --silent --show-error \
            -X POST "$PUBLISH_URL" \
            -H 'content-type: application/json' \
            -H "x-github-token: $GH_TOKEN" \
            --data-binary "$PAYLOAD" > finalize.json
          jq -e '.ok == true and .action == "finalize"' finalize.json >/dev/null

          LIVE=$(curl --fail-with-body --silent --show-error -H 'Cache-Control: no-cache' "$PV_MANIFEST_URL")
          echo "$LIVE" | jq -e --argjson vc "$PV_VERSION_CODE" --arg sha "$PV_RELEASE_SHA" \
            '.versionCode == $vc and .sha256 == $sha' >/dev/null
          echo "$LIVE" | jq .

      - name: Prepare public update artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-update
          cp puttvision-consumer.apk public-update/puttvision.apk
          cat > public-update/update.json <<EOF
          {
            "versionCode": $PV_VERSION_CODE,
            "versionName": "$PV_VERSION_NAME",
            "apkUrl": "$PV_APK_URL",
            "sha256": "$PV_RELEASE_SHA"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Public-Update-${{ env.PV_VERSION_NAME }}
          path: public-update/

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Developer-${{ env.PV_VERSION_NAME }}
          path: |
            puttvision.apk
            puttvision.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Consumer-${{ env.PV_VERSION_NAME }}
          path: |
            puttvision-consumer.apk
            puttvision-consumer.apk.sha256
