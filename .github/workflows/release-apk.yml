name: Build and publish PuttVision APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: puttvision-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Allocate monotonic app version
        shell: bash
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.7.${GITHUB_RUN_NUMBER}"
          echo "PV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PV_TAG=pv-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest

      - name: Real-device measurement regression gate
        shell: bash
        run: |
          set -euo pipefail
          REF=validation/v20_reference.csv
          MEASURED=validation/v20_measured.csv
          if [ -f "$REF" ] && [ -f "$MEASURED" ]; then
            echo "Running BALL / START / FACE / PATH real-device accuracy gate"
            python3 ci/v20_accuracy_gate.py "$REF" "$MEASURED"
          elif [ -f "$REF" ] || [ -f "$MEASURED" ]; then
            echo "Accuracy fixture set is incomplete; both $REF and $MEASURED are required" >&2
            exit 1
          else
            echo "No real-device reference dataset committed yet; release accuracy gate is armed but inactive."
          fi

      - name: Restore rotated release signing bundle
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.PUTTVISION_SIGNING_BUNDLE_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE_FILE="$RUNNER_TEMP/puttvision-signing-bundle.tgz"

          if [ -n "$SIGNING_BUNDLE_B64" ]; then
            printf '%s' "$SIGNING_BUNDLE_B64" | base64 -d > "$BUNDLE_FILE"
          else
            ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == true and .tag_name == "puttvision-signing-vault-v1") | .assets[] | select(.name == "puttvision-signing-bundle.tgz") | .id' | head -1)
            if [ -z "$ASSET_ID" ]; then
              echo "Missing required release signing secret: PUTTVISION_SIGNING_BUNDLE_B64; private signing escrow is also unavailable" >&2
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$BUNDLE_FILE"
          fi

          test -s "$BUNDLE_FILE"
          SIGNING_DIR="$RUNNER_TEMP/puttvision-signing"
          mkdir -p "$SIGNING_DIR"
          tar -xzf "$BUNDLE_FILE" -C "$SIGNING_DIR"
          test -s "$SIGNING_DIR/release.jks"
          test -s "$SIGNING_DIR/signing-lineage"
          test -s "$SIGNING_DIR/signing.env"
          chmod 600 "$SIGNING_DIR/release.jks" "$SIGNING_DIR/signing-lineage" "$SIGNING_DIR/signing.env"

          set -a
          source "$SIGNING_DIR/signing.env"
          set +a
          for name in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS ROTATION_MIN_SDK; do
            if [ -z "${!name:-}" ]; then
              echo "Signing bundle is missing $name" >&2
              exit 1
            fi
          done
          keytool -list -keystore "$SIGNING_DIR/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/puttvision-store.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/puttvision-key.pass"
          chmod 600 "$RUNNER_TEMP/puttvision-store.pass" "$RUNNER_TEMP/puttvision-key.pass"
          echo "PV_SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PV_ROTATION_MIN_SDK=$ROTATION_MIN_SDK" >> "$GITHUB_ENV"

      - name: Build unsigned consumer and developer APKs
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
        run: gradle assembleConsumerRelease assembleDeveloperRelease

      - name: Sign with rotated key lineage and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner not available" >&2
            exit 1
          fi

          CONSUMER_UNSIGNED=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          DEVELOPER_UNSIGNED=$(find app/build/outputs/apk/developer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          test -s "$CONSUMER_UNSIGNED"
          test -s "$DEVELOPER_UNSIGNED"

          sign_one() {
            local input="$1"
            local output="$2"
            "$APKSIGNER" sign \
              --ks "$PV_SIGNING_DIR/release.jks" \
              --ks-key-alias "$PV_KEY_ALIAS" \
              --ks-pass "file:$RUNNER_TEMP/puttvision-store.pass" \
              --key-pass "file:$RUNNER_TEMP/puttvision-key.pass" \
              --lineage "$PV_SIGNING_DIR/signing-lineage" \
              --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK" \
              --v1-signing-enabled false \
              --v2-signing-enabled false \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "$output" \
              "$input"
            "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 28 "$output"
          }

          sign_one "$CONSUMER_UNSIGNED" puttvision-consumer.apk
          sign_one "$DEVELOPER_UNSIGNED" puttvision.apk
          sha256sum puttvision.apk > puttvision.apk.sha256
          sha256sum puttvision-consumer.apk > puttvision-consumer.apk.sha256

      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(puttvision.apk puttvision.apk.sha256 puttvision-consumer.apk puttvision-consumer.apk.sha256)
          if gh release view "$PV_TAG" >/dev/null 2>&1; then
            gh release upload "$PV_TAG" "${ASSETS[@]}" --clobber
            gh release edit "$PV_TAG" --title "PuttVision $PV_VERSION_NAME" --notes "PuttVision $PV_VERSION_NAME · rotated-key verified consumer/developer release" --latest
          else
            gh release create "$PV_TAG" "${ASSETS[@]}" \
              --title "PuttVision $PV_VERSION_NAME" \
              --notes "PuttVision $PV_VERSION_NAME · rotated-key verified consumer/developer release" \
              --latest
          fi

      - name: Prepare consumer update bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-update
          cp puttvision-consumer.apk public-update/puttvision.apk
          SHA=$(cut -d' ' -f1 puttvision-consumer.apk.sha256)
          cat > public-update/update.json <<EOF
          {
            "versionCode": $PV_VERSION_CODE,
            "versionName": "$PV_VERSION_NAME",
            "apkUrl": "https://puttvision-update.vercel.app/puttvision.apk",
            "sha256": "$SHA"
          }
          EOF
          cat > public-update/vercel.json <<'EOF'
          {
            "headers": [
              {"source": "/update.json", "headers": [{"key": "Cache-Control", "value": "public, max-age=0, must-revalidate"}]},
              {"source": "/puttvision.apk", "headers": [{"key": "Cache-Control", "value": "public, max-age=60"}]}
            ]
          }
          EOF

      - name: Publish consumer updater to Vercel when configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Consumer updater hosting is not configured; public-update artifact is still available."
            exit 0
          fi
          npx --yes vercel@latest deploy public-update --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Public-Update-${{ env.PV_VERSION_NAME }}
          path: public-update/

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Developer-${{ env.PV_VERSION_NAME }}
          path: |
            puttvision.apk
            puttvision.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Consumer-${{ env.PV_VERSION_NAME }}
          path: |
            puttvision-consumer.apk
            puttvision-consumer.apk.sha256
