name: Build and publish PuttVision APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: puttvision-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Allocate monotonic app version
        shell: bash
        run: |
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.7.${GITHUB_RUN_NUMBER}"
          echo "PV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PV_TAG=pv-$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PUTTVISION_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/puttvision-release.jks"
          elif [ -f ci/puttvision-release.jks.b64 ]; then
            base64 -d ci/puttvision-release.jks.b64 > "$RUNNER_TEMP/puttvision-release.jks"
          else
            echo "No release keystore configured" >&2
            exit 1
          fi

      - name: Build signed release APK
        env:
          PUTTVISION_STORE_FILE: ${{ runner.temp }}/puttvision-release.jks
          PUTTVISION_STORE_PASSWORD: ${{ secrets.PUTTVISION_STORE_PASSWORD || 'PuttVision_2026_UpdateKey' }}
          PUTTVISION_KEY_ALIAS: ${{ secrets.PUTTVISION_KEY_ALIAS || 'puttvision' }}
          PUTTVISION_KEY_PASSWORD: ${{ secrets.PUTTVISION_KEY_PASSWORD || 'PuttVision_2026_UpdateKey' }}
        run: gradle assembleRelease

      - name: Prepare verified assets
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk puttvision.apk
          sha256sum puttvision.apk > puttvision.apk.sha256

      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$PV_TAG" >/dev/null 2>&1; then
            gh release upload "$PV_TAG" puttvision.apk puttvision.apk.sha256 --clobber
            gh release edit "$PV_TAG" --title "PuttVision $PV_VERSION_NAME" --notes "Automated PuttVision release $PV_VERSION_NAME" --latest
          else
            gh release create "$PV_TAG" puttvision.apk puttvision.apk.sha256 \
              --title "PuttVision $PV_VERSION_NAME" \
              --notes "Automated PuttVision release $PV_VERSION_NAME" \
              --latest
          fi

      - name: Prepare consumer update bundle
        shell: bash
        run: |
          mkdir -p public-update
          cp puttvision.apk public-update/puttvision.apk
          SHA=$(cut -d' ' -f1 puttvision.apk.sha256)
          cat > public-update/update.json <<EOF
          {
            "versionCode": $PV_VERSION_CODE,
            "versionName": "$PV_VERSION_NAME",
            "apkUrl": "https://puttvision-update.vercel.app/puttvision.apk",
            "sha256": "$SHA"
          }
          EOF
          cat > public-update/vercel.json <<'EOF'
          {
            "headers": [
              {"source": "/update.json", "headers": [{"key": "Cache-Control", "value": "public, max-age=0, must-revalidate"}]},
              {"source": "/puttvision.apk", "headers": [{"key": "Cache-Control", "value": "public, max-age=60"}]}
            ]
          }
          EOF

      - name: Publish consumer updater to Vercel when configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Consumer updater hosting is not configured; public-update artifact is still available."
            exit 0
          fi
          npx --yes vercel@latest deploy public-update --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-Public-Update-${{ env.PV_VERSION_NAME }}
          path: public-update/

      - uses: actions/upload-artifact@v4
        with:
          name: PuttVision-${{ env.PV_VERSION_NAME }}
          path: |
            puttvision.apk
            puttvision.apk.sha256
