name: Dispatch current-main release

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.issue.number == 138 && github.event.comment.body == '/release-current-main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Signal dispatcher start
        run: curl --fail-with-body -sS https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher >/dev/null
      - name: Dispatch current-main direct release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v152-direct-release.yml --repo "$GITHUB_REPOSITORY" --ref main
