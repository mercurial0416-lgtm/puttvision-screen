name: V152 trigger probe

on:
  push:
    branches: [main]
    paths:
      - .release-v152-now

permissions:
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 138 --body "V152 push trigger confirmed · run ${GITHUB_RUN_ID} · sha ${GITHUB_SHA}"
