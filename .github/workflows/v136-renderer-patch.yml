name: V136 renderer one-shot patch

on:
  push:
    branches:
      - agent/v136-physical-realism-pack

permissions:
  contents: write

jobs:
  patch-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v136-physical-realism-pack
          fetch-depth: 0
      - name: Apply guarded V136 Filament patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/puttvision/screen/V133FilamentCourse.kt')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {n}')
              s = s.replace(old, new, 1)

          once(
          '''private data class V133SceneKey(
              val profile: Int,
              val distance100: Int,
              val side100: Int,
              val long100: Int,
              val customHash: Int,
              val tier: V24RenderTier
          )''',
          '''private data class V133SceneKey(
              val profile: Int,
              val distance100: Int,
              val side100: Int,
              val long100: Int,
              val customHash: Int,
              val flagstickIn: Boolean,
              val tier: V24RenderTier
          )''', 'scene key')

          once(
          '''    private val sceneMeshes = mutableListOf<V133Mesh>()
              private var ballMesh: V133Mesh? = null
              private var sceneKey: V133SceneKey? = null''',
          '''    private val sceneMeshes = mutableListOf<V133Mesh>()
              private var ballMesh: V133Mesh? = null
              private var ballMarkerMesh: V133Mesh? = null
              private var sceneKey: V133SceneKey? = null''', 'ball marker field')

          once(
          '''    private fun setupBall() {
              val geometry = V133Geometry.sphere(0f, 0f, 0f, V133CourseSpec.BALL_RADIUS_M, 12, 18)
              ballMesh = createRenderable(
                  geometry,
                  materialInstance(ballMaterial, .94f, .95f, .93f),
                  castShadow = true,
                  contactShadow = true
              )
          }''',
          '''    private fun setupBall() {
              val geometry = V133Geometry.sphere(0f, 0f, 0f, V133CourseSpec.BALL_RADIUS_M, 12, 18)
              ballMesh = createRenderable(
                  geometry,
                  materialInstance(ballMaterial, .94f, .95f, .93f),
                  castShadow = true,
                  contactShadow = true
              )

              // Small dark alignment dot is local to the ball origin. Applying the same V135
              // quaternion transform makes real skid/roll/spin visible instead of hiding rotation
              // behind a perfectly featureless white sphere.
              val marker = V133Geometry.ellipsoid(
                  0f,
                  0f,
                  V133CourseSpec.BALL_RADIUS_M * .94f,
                  .0048f,
                  .0048f,
                  .0018f,
                  6,
                  10
              )
              ballMarkerMesh = createRenderable(
                  marker,
                  materialInstance(propMaterial, .045f, .050f, .047f),
                  castShadow = false,
                  contactShadow = false
              )
          }''', 'setup ball')

          once(
          '''            ((settings.longSlopePct.takeIf { it.isFinite() } ?: 0.0) * 100).toInt(),
              V28CustomGreenCodec.signature(V22CustomGreenRuntime.profile),
              tier
          )''',
          '''            ((settings.longSlopePct.takeIf { it.isFinite() } ?: 0.0) * 100).toInt(),
              V28CustomGreenCodec.signature(V22CustomGreenRuntime.profile),
              settings.flagstickIn,
              tier
          )''', 'scene key constructor')

          old_flag = '''        val pole = V133Geometry.cylinder(
              0f,
              d.toFloat(),
              base + .004f,
              .0065f,
              V133CourseSpec.FLAG_HEIGHT_M,
              12
          )
          sceneMeshes += createRenderable(
              pole,
              materialInstance(propMaterial, .83f, .84f, .80f),
              castShadow = true,
              contactShadow = true
          )

          val flag = V133Geometry.flag(0f, d.toFloat(), base + V133CourseSpec.FLAG_HEIGHT_M)
          sceneMeshes += createRenderable(
              flag,
              materialInstance(propMaterial, .64f, .075f, .055f),
              castShadow = true,
              contactShadow = false
          )'''
          new_flag = '''        if (settings.flagstickIn) {
              val pole = V133Geometry.cylinder(
                  0f,
                  d.toFloat(),
                  base + .004f,
                  .0065f,
                  V133CourseSpec.FLAG_HEIGHT_M,
                  12
              )
              sceneMeshes += createRenderable(
                  pole,
                  materialInstance(propMaterial, .83f, .84f, .80f),
                  castShadow = true,
                  contactShadow = true
              )

              val flag = V133Geometry.flag(0f, d.toFloat(), base + V133CourseSpec.FLAG_HEIGHT_M)
              sceneMeshes += createRenderable(
                  flag,
                  materialInstance(propMaterial, .64f, .075f, .055f),
                  castShadow = true,
                  contactShadow = false
              )
          }'''
          once(old_flag, new_flag, 'flag visibility')

          old_ball = '''        ballMesh?.let { mesh ->
              val cupVerticalOffset = state
                  ?.takeIf { it.cupPhase != V134CupPhase.NONE }
                  ?.cupVerticalOffsetM
                  ?.toFloat()
                  ?: 0f
              val z = GreenTerrain.effectiveHeightAt(settings, bx, by).toFloat() +
                  V133CourseSpec.BALL_RADIUS_M + .020f + cupVerticalOffset
              val transform = floatArrayOf(
                  1f, 0f, 0f, 0f,
                  0f, 1f, 0f, 0f,
                  0f, 0f, 1f, 0f,
                  bx.toFloat(), by.toFloat(), z, 1f
              )
              val tm = engine.transformManager
              tm.setTransform(tm.getInstance(mesh.entity), transform)
          }'''
          new_ball = '''        val fallbackCenterZ = GreenTerrain.effectiveHeightAt(settings, bx, by) +
              V133CourseSpec.BALL_RADIUS_M
          val transform = V136BallPose.matrix(state, bx, by, fallbackCenterZ)
          val tm = engine.transformManager
          ballMesh?.let { mesh -> tm.setTransform(tm.getInstance(mesh.entity), transform) }
          ballMarkerMesh?.let { mesh -> tm.setTransform(tm.getInstance(mesh.entity), transform) }'''
          once(old_ball, new_ball, 'ball pose')

          once(
          '''        ballMesh?.let { runCatching { destroyMesh(it) } }
              ballMesh = null
              swapChain?.let { runCatching { engine.destroySwapChain(it) } }''',
          '''        ballMesh?.let { runCatching { destroyMesh(it) } }
              ballMesh = null
              ballMarkerMesh?.let { runCatching { destroyMesh(it) } }
              ballMarkerMesh = null
              swapChain?.let { runCatching { engine.destroySwapChain(it) } }''', 'marker cleanup')

          p.write_text(s)
          PY

          git diff --check
          git diff -- app/src/main/java/com/puttvision/screen/V133FilamentCourse.kt
          if git diff --quiet; then
            echo 'Renderer already patched; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/puttvision/screen/V133FilamentCourse.kt
          git commit -m 'V136: bind Filament ball to physical pose'
          git push origin HEAD:agent/v136-physical-realism-pack
