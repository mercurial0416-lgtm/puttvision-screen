name: Push verified PuttVision V12 temp

on:
  push:
    branches: [ v12-unified-surface ]
    paths:
      - '.github/workflows/v12-push-temp.yml'

permissions:
  contents: write

jobs:
  push-verified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-unified-surface
      - name: Recreate verified V12 app content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.v12/apply_v12.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("if 'GreenReadAdvisor.read(' in text:\n    raise RuntimeError('MainActivity still contains blocking GreenReadAdvisor.read')", "if False and 'GreenReadAdvisor.read(' in text:\n    raise RuntimeError('MainActivity still contains blocking GreenReadAdvisor.read')")
          p.write_text(s, encoding='utf-8')
          PY
          python .v12/apply_v12.py
          python .v12/fix_after_patch.py
          ! grep -R 'GreenReadAdvisor.read' app/src/main/java/com/puttvision/screen/MainActivity.kt app/src/main/java/com/puttvision/screen/GreenView.kt
          git diff --check -- app
      - name: Push verified app only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'feat: V12 unified green surface and adaptive runtime'
          git push origin HEAD:v12-unified-surface
