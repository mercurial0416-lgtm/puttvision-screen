name: Updater bridge recovery 183

on:
  pull_request:
    paths:
      - 'app/**'
      - 'ci/v143_fetch_cc0_assets.py'
      - '.github/workflows/updater-bridge-183.yml'

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.head_ref == 'hotfix/updater-bridge-183' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore release signing lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/signing-v3.tgz"
          DIR="$RUNNER_TEMP/signing-v3"
          ASSET_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "puttvision-signing-vault-v3") | .assets[] | select(.name == "puttvision-signing-bundle-v3.tgz" or .label == "puttvision-signing-bundle.tgz") | .id' | head -1)
          test -n "$ASSET_ID"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$BUNDLE"
          mkdir -p "$DIR"; tar -xzf "$BUNDLE" -C "$DIR"
          set -a; source "$DIR/signing.env"; set +a
          test "$ROTATION_MIN_SDK" = 28
          CERT=$(keytool -exportcert -keystore "$DIR/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          test "$CERT" = '7a5962aee08d9edc655da5f58cb8199b4d41604793ef539bd0111df2ca0900cb'
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          chmod 600 "$RUNNER_TEMP/store.pass" "$RUNNER_TEMP/key.pass"
          echo "PV_SIGNING_DIR=$DIR" >> "$GITHUB_ENV"
          echo "PV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PV_ROTATION_MIN_SDK=$ROTATION_MIN_SDK" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: release/v143-bridge
          fetch-depth: 0

      - name: Build small 0.7.182 bridge
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
          PV_VERSION_CODE: '100182'
          PV_VERSION_NAME: '0.7.182'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'update-v2.json' app/src/main/java/com/puttvision/screen/AppUpdater.kt
          grep -q 'GITHUB_RELEASE_HOST' app/src/main/java/com/puttvision/screen/V49UpdatePolicy.kt
          gradle testConsumerDebugUnitTest
          gradle assembleConsumerRelease
          A=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)
          C=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          "$A" sign --ks "$PV_SIGNING_DIR/release.jks" --ks-key-alias "$PV_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --lineage "$PV_SIGNING_DIR/signing-lineage" --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK" --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false --out puttvision-bridge.apk "$C"
          "$A" verify --verbose --print-certs --min-sdk-version 28 puttvision-bridge.apk
          B_SIZE=$(stat -c%s puttvision-bridge.apk)
          test "$B_SIZE" -lt $((48 * 1024 * 1024))
          B_SHA=$(sha256sum puttvision-bridge.apk | cut -d' ' -f1)
          echo "BRIDGE_SIZE=$B_SIZE" >> "$GITHUB_ENV"
          echo "BRIDGE_SHA=$B_SHA" >> "$GITHUB_ENV"

      - name: Stage bridge in Supabase without publishing manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
          SUPABASE_URL: https://razejagceyznnajioxgx.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_fjgUBLTNcWG5-f8EDFpLyw_P5wXmmFS
        run: |
          set -euo pipefail
          jq -nc --arg action prepare --argjson vc 100182 --arg vn '0.7.182' --arg sha "$BRIDGE_SHA" --argjson size "$BRIDGE_SIZE" '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}' > prepare-payload.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" -H 'content-type: application/json' -H "x-github-token: $GH_TOKEN" --data-binary @prepare-payload.json > prepare.json
          jq -e '.ok == true and .action == "prepare" and .versionCode == 100182' prepare.json >/dev/null
          BRIDGE_UPLOAD_TOKEN=$(jq -r .uploadToken prepare.json)
          BRIDGE_OBJECT_PATH=$(jq -r .objectPath prepare.json)
          BRIDGE_APK_URL=$(jq -r .apkUrl prepare.json)
          export BRIDGE_UPLOAD_TOKEN BRIDGE_OBJECT_PATH BRIDGE_APK_URL
          echo "::add-mask::$BRIDGE_UPLOAD_TOKEN"
          echo "BRIDGE_UPLOAD_TOKEN=$BRIDGE_UPLOAD_TOKEN" >> "$GITHUB_ENV"
          echo "BRIDGE_OBJECT_PATH=$BRIDGE_OBJECT_PATH" >> "$GITHUB_ENV"
          echo "BRIDGE_APK_URL=$BRIDGE_APK_URL" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock @supabase/supabase-js@2.57.4 >/dev/null
          node <<'NODE'
          const fs=require('fs'); const {createClient}=require('@supabase/supabase-js');
          (async()=>{const s=createClient(process.env.SUPABASE_URL,process.env.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}}); const b=fs.readFileSync('puttvision-bridge.apk'); const {data,error}=await s.storage.from('puttvision-update').uploadToSignedUrl(process.env.BRIDGE_OBJECT_PATH,process.env.BRIDGE_UPLOAD_TOKEN,b,{contentType:'application/vnd.android.package-archive',cacheControl:'31536000'}); if(error)throw error; if(!data?.path)throw Error('bridge upload path missing')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl --fail-with-body -sSL "$BRIDGE_APK_URL" -o verify-bridge.apk
          test "$(stat -c%s verify-bridge.apk)" -eq "$BRIDGE_SIZE"
          echo "$BRIDGE_SHA  verify-bridge.apk" | sha256sum -c -

      - uses: actions/checkout@v4
        with:
          ref: hotfix/updater-bridge-183
          fetch-depth: 0
          clean: true

      - name: Build and test full 0.7.183 V145
        env:
          PV_EXTERNAL_SIGNING: 'true'
          PV_LICENSE_PUBLIC_KEY_B64: ${{ secrets.PV_LICENSE_PUBLIC_KEY_B64 }}
          PV_VERSION_CODE: '100183'
          PV_VERSION_NAME: '0.7.183'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'update-v2.json' app/src/main/java/com/puttvision/screen/AppUpdater.kt
          grep -q 'GITHUB_RELEASE_HOST' app/src/main/java/com/puttvision/screen/V49UpdatePolicy.kt
          python3 ci/v143_fetch_cc0_assets.py
          gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
          gradle assembleConsumerRelease
          A=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)
          C=$(find app/build/outputs/apk/consumer/release -maxdepth 1 -type f -name '*unsigned*.apk' | head -1)
          "$A" sign --ks "$PV_SIGNING_DIR/release.jks" --ks-key-alias "$PV_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/store.pass" --key-pass "file:$RUNNER_TEMP/key.pass" --lineage "$PV_SIGNING_DIR/signing-lineage" --rotation-min-sdk-version "$PV_ROTATION_MIN_SDK" --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false --out puttvision-consumer.apk "$C"
          "$A" verify --verbose --print-certs --min-sdk-version 28 puttvision-consumer.apk
          FULL_SIZE=$(stat -c%s puttvision-consumer.apk)
          test "$FULL_SIZE" -lt $((180 * 1024 * 1024))
          FULL_SHA=$(sha256sum puttvision-consumer.apk | cut -d' ' -f1)
          echo "$FULL_SHA  puttvision-consumer.apk" > puttvision-consumer.apk.sha256
          echo "FULL_SIZE=$FULL_SIZE" >> "$GITHUB_ENV"
          echo "FULL_SHA=$FULL_SHA" >> "$GITHUB_ENV"
          echo "FULL_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/pv-100183/puttvision-consumer.apk" >> "$GITHUB_ENV"

      - name: Publish full 0.7.183 and update-v2 first
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        run: |
          set -euo pipefail
          if gh release view pv-100183 >/dev/null 2>&1; then
            gh release upload pv-100183 puttvision-consumer.apk puttvision-consumer.apk.sha256 --clobber
            gh release edit pv-100183 --title 'PuttVision 0.7.183' --notes 'V145 crash fix plus updater-channel recovery.' --latest
          else
            gh release create pv-100183 puttvision-consumer.apk puttvision-consumer.apk.sha256 --target hotfix/updater-bridge-183 --title 'PuttVision 0.7.183' --notes 'V145 crash fix plus updater-channel recovery.' --latest
          fi
          curl --fail-with-body -sSIL "$FULL_URL" >/dev/null
          jq -nc --arg action external-finalize --argjson vc 100183 --arg vn '0.7.183' --arg sha "$FULL_SHA" --argjson size "$FULL_SIZE" --arg apkUrl "$FULL_URL" '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size,apkUrl:$apkUrl}' > full.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" -H 'content-type: application/json' -H "x-github-token: $GH_TOKEN" --data-binary @full.json | tee full-finalize.json
          jq -e '.ok == true and .versionCode == 100183' full-finalize.json >/dev/null

      - name: Publish 0.7.182 bridge to legacy channel last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_URL: https://razejagceyznnajioxgx.supabase.co/functions/v1/puttvision-update-publisher
        run: |
          set -euo pipefail
          jq -nc --arg action finalize --argjson vc 100182 --arg vn '0.7.182' --arg sha "$BRIDGE_SHA" --argjson size "$BRIDGE_SIZE" '{action:$action,versionCode:$vc,versionName:$vn,sha256:$sha,sizeBytes:$size}' > bridge-finalize.json
          curl --fail-with-body -sS -X POST "$PUBLISH_URL" -H 'content-type: application/json' -H "x-github-token: $GH_TOKEN" --data-binary @bridge-finalize.json | tee legacy.json
          jq -e '.ok == true and .versionCode == 100182' legacy.json >/dev/null

          LEGACY=https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update.json
          V2=https://razejagceyznnajioxgx.supabase.co/storage/v1/object/public/puttvision-update/update-v2.json
          ok=0
          for i in $(seq 1 24); do
            L=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$LEGACY?settle=$(date +%s%N)" || true)
            N=$(curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$V2?settle=$(date +%s%N)" || true)
            if echo "$L" | jq -e --arg sha "$BRIDGE_SHA" '.versionCode == 100182 and .sha256 == $sha' >/dev/null 2>&1 && echo "$N" | jq -e --arg sha "$FULL_SHA" '.versionCode == 100183 and .sha256 == $sha' >/dev/null 2>&1; then
              echo "$L" | jq .; echo "$N" | jq .; ok=1; break
            fi
            sleep 5
          done
          test "$ok" -eq 1
