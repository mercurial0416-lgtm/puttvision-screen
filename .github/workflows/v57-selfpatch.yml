name: V57 one-shot surface parity patch

on:
  push:
    branches:
      - agent/solo-v57-hardwareless-surface-parity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v57-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solo-v57-hardwareless-surface-parity
          fetch-depth: 0
      - name: Apply canonical TV surface wiring
        run: python3 ci/v57_apply_surface_parity.py
      - name: Remove one-shot patch plumbing
        run: rm ci/v57_apply_surface_parity.py .github/workflows/v57-selfpatch.yml
      - name: Commit patched product sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/puttvision/screen/MainActivity.kt \
                  app/src/main/java/com/puttvision/screen/ExternalDisplayController.kt \
                  ci/v57_apply_surface_parity.py \
                  .github/workflows/v57-selfpatch.yml
          git commit -m 'Wire canonical TV surface everywhere [v57-patched]'
          git push origin HEAD:agent/solo-v57-hardwareless-surface-parity
