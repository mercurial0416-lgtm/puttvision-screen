name: V128 native runner verify

on:
  push:
    branches: [ 'agent/v128-*' ]

permissions:
  contents: read

concurrency:
  group: v128-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Show native toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -n "${ANDROID_HOME:-}"

      - name: V128 consumer and developer regression tests
        shell: bash
        run: |
          set -euo pipefail
          gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
