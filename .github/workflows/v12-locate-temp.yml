name: Locate PuttVision V12 temp

on:
  push:
    branches: [ v12-unified-surface ]
    paths:
      - '.github/workflows/v12-locate-temp.yml'

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12-unified-surface
      - name: Apply patch and locate remaining reads
        shell: bash
        run: |
          python .v12/apply_v12.py || true
          echo '--- remaining GreenReadAdvisor.read ---'
          grep -n -C 4 'GreenReadAdvisor.read' app/src/main/java/com/puttvision/screen/MainActivity.kt || true
          echo '--- done ---'
