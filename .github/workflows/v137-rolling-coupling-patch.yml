name: V137 rolling coupling one-shot patch

on:
  push:
    branches:
      - agent/v137-variable-rolling-resistance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v137-variable-rolling-resistance
          fetch-depth: 0
      - name: Apply guarded rolling-resistance angular coupling patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/puttvision/screen/V135RigidBallPhysics.kt')
          s = p.read_text()

          old = '''        var accel = drive
        if (speed > 0.003) {
            accel += V3(-state.vx / speed * rollingDecel, -state.vy / speed * rollingDecel, 0.0)
        } else if (driveMag > rollingDecel) {
            accel = drive * ((driveMag - rollingDecel) / driveMag)
        }

        val tangentVz = surface.dzdx * state.vx + surface.dzdy * state.vy
        val velocity = V3(state.vx, state.vy, tangentVz)
        var omega = V3(state.omegaXRadS, state.omegaYRadS, state.omegaZRadS)
        val contactArm = normal * -BALL_RADIUS_M
'''
          new = '''        var accel = drive
        var rollingResistanceAccel = V3(0.0, 0.0, 0.0)
        if (speed > 0.003) {
            rollingResistanceAccel = V3(
                -state.vx / speed * rollingDecel,
                -state.vy / speed * rollingDecel,
                0.0
            )
            accel += rollingResistanceAccel
        } else if (driveMag > rollingDecel) {
            accel = drive * ((driveMag - rollingDecel) / driveMag)
        }

        val tangentVz = surface.dzdx * state.vx + surface.dzdy * state.vy
        val velocity = V3(state.vx, state.vy, tangentVz)
        var omega = V3(state.omegaXRadS, state.omegaYRadS, state.omegaZRadS)

        // Rolling resistance is a generalized dissipative load, not a skid impulse. Couple its
        // translational deceleration to the matching angular deceleration so an already-pure-roll
        // ball keeps v_contact=0. Without this, slowing COM alone creates artificial slip on the
        // next 480 Hz microstep and Coulomb friction pushes the ball forward again, causing the
        // selected Stimp to over-roll materially.
        if (rollingResistanceAccel.mag2() > 0.0) {
            val tangentResistance = V3(
                rollingResistanceAccel.x,
                rollingResistanceAccel.y,
                surface.dzdx * rollingResistanceAccel.x + surface.dzdy * rollingResistanceAccel.y
            )
            omega += normal.cross(tangentResistance) * (dt / BALL_RADIUS_M)
        }

        val contactArm = normal * -BALL_RADIUS_M
'''

          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one rolling block, found {n}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          if git diff --quiet; then
            echo 'No patch produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/puttvision/screen/V135RigidBallPhysics.kt
          git commit -m 'V137: couple rolling resistance to ball rotation'
          git push origin HEAD:agent/v137-variable-rolling-resistance
