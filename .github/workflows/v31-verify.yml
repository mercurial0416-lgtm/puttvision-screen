name: Verify V33 final AR online durability

on:
  push:
    branches: [ agent/v33-verify-final ]

permissions:
  contents: read

concurrency:
  group: v33-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit and regression tests
        run: gradle testConsumerDebugUnitTest testDeveloperDebugUnitTest
      - name: Compile consumer and developer APKs
        run: gradle assembleConsumerDebug assembleDeveloperDebug
